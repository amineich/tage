/* ============ Actions ============ */
function toast(msg){const d=document.createElement('div');d.className='alertbar';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
const cur=()=>SES&&SES.steps[SES.i];
function insertLater(step){const lim=SES.steps.findIndex((s,i)=>i>SES.i&&(s.k==='sprint'||s.k==='bilan'));const end=lim<0?SES.steps.length:lim;SES.steps.splice(Math.min(SES.i+4,end),0,step)}
function evaluate(st,ok){
  const now=Date.now(),ms=now-st.t0;st.ok=ok;st.phase='fb';
  const g=!ok?1:st.conf==='guess'?2:st.conf==='mid'?3:(ms<45000?4:3);
  if(st.extra){if(!ok&&S.cards[st.id])S.cards[st.id].due=Math.min(S.cards[st.id].due,now+20*MIN);S.reviews.push({t:now,id:st.id,g,type:'p',sub:CBYID[st.cid].sub,rev:false,ms,ok,conf:st.conf})}
  else{const n=schedule(st.id,g,{ms,ok,conf:st.conf});st.iv=fmtIv(n.due-now)}
  if(!ok&&!st.requeued)insertLater({k:'prob',id:st.id,cid:st.cid,extra:true,requeued:true});
  SES.log.push({k:'prob',ok});save();saveSes();render();
}

  prePick:d=>{const st=cur();if(st.sel!=null)return;st.sel=+d.i;saveSes();render()},
  preNext:()=>{const st=cur();st.sel=null;if(st.pi===0)st.pi=1;else st.phase='fiche';saveSes();render();window.scrollTo(0,0)},
  toQuiz:()=>{const st=cur();st.phase='quiz';st.sel=null;saveSes();render();window.scrollTo(0,0)},
  quizPick:d=>{const st=cur();if(st.sel!=null)return;st.sel=+d.i;if(st.sel===st.quiz[st.qi].a)st.score++;saveSes();render()},
  quizNext:()=>{const st=cur();st.sel=null;st.qi++;if(st.qi>=4){st.phase='done';introduceConcept(st.cid,st.score);SES.log.push({k:'concept',cid:st.cid,score:st.score})}saveSes();render();window.scrollTo(0,0)},
  /* sprint */
  sprintGo:()=>{const st=cur();st.phase='run';st.start=Date.now();st.qStart=Date.now();st.cursel=null;saveSes();render()},
  sprintPick:d=>{cur().cursel=+d.i;render()},
  sprintOk:()=>sprintAdvance(cur().cursel),
  sprintSkip:()=>sprintAdvance(null),
  /* test du livre */
  bookGo:()=>{const st=cur();st.phase='run';st.start=Date.now();st.dur=20*60000;saveSes();render()},
  bookAns:d=>{const st=cur();const q=+d.q,j=+d.j;st.ans[q]=st.ans[q]===j?null:j;saveSes();render()},
  bookEnd:()=>{const st=cur();if(Date.now()-st.start<st.dur&&!confirm('Il reste du temps. Passer au corrigé ?'))return;st.phase='key';saveSes();render()},
  bookKey:d=>{const st=cur();st.key[+d.q]=+d.j;saveSes();render()},
  bookCorrect:()=>{const st=cur();st.nok=st.ans.filter((a,i)=>a===st.key[i]).length;st.nskip=st.ans.filter(a=>a==null).length;st.nko=15-st.nok-st.nskip;st.score=4*st.nok-st.nko;st.phase='errs';saveSes();render();window.scrollTo(0,0)},
  errCause:d=>{const st=cur();const e=st.errs[d.q]||(st.errs[d.q]={cid:'',cause:''});e.cause=d.v;saveSes();render()},
  bookSave:()=>{const st=cur();const now=Date.now();
    st.ans.forEach((a,i)=>{if(a===st.key[i])return;const e=st.errs[i]||{};const cid=CBYID[e.cid]?e.cid:null;const id=`err:${now}-${i}`;S.errs.push({id,test:st.test,sub:st.sub,q:i+1,cid,cause:e.cause||'Non précisée',t:now});S.cards[id]={reps:0,due:now+18*3600e3};if(cid&&S.cards[cid+':p'])S.cards[cid+':p'].due=Math.min(S.cards[cid+':p'].due,now)});
    S.book.push({t:now,sub:st.sub,test:st.test,score:st.score,ok:st.nok,ko:st.nko,skip:st.nskip});buildDefs();save();st.phase='done';saveSes();render()},
  /* réglages */
  setNew:d=>{S.settings.newPerDay=+d.n;save();render()},
  setTheme:d=>{S.settings.theme=d.t;save();applyTheme();render()},
  exportS:()=>{const txt=JSON.stringify(S);const ta=$('#bk');if(ta)ta.value=txt;try{navigator.clipboard.writeText(txt).then(()=>toast('Code de sauvegarde copié')).catch(()=>toast('Copie le texte affiché ci-dessous'))}catch(e){toast('Copie le texte affiché ci-dessous')}},
  importS:()=>{const ta=$('#bk');try{const o=JSON.parse(ta.value);if(!o||!o.cards||!o.studied)throw 0;const b=blank();S=Object.assign(b,o,{settings:Object.assign(b.settings,o.settings||{})});buildDefs();save();applyTheme();toast('Progression restaurée');render()}catch(e){toast('Ce code n’est pas valide. Colle le code complet.')}},
  createSpace:()=>createSpace(),
  copyLink:()=>{const l=personalLink();try{navigator.clipboard.writeText(l).then(()=>toast('Lien copié')).catch(()=>prompt('Ton lien personnel :',l))}catch(e){prompt('Ton lien personnel :',l)}},
  resetAll:()=>{if(!confirm('Effacer toute la progression ? C’est définitif.'))return;S=blank();buildDefs();save();try{localStorage.removeItem(SKEY)}catch(e){}PENDING=null;render()}
};
function sprintAdvance(v){const st=cur();if(st.phase!=='run')return;st.ans[st.qi]=v;st.ms[st.qi]=Date.now()-st.qStart;st.cursel=null;st.qi++;st.qStart=Date.now();UI.scr=false;if(st.qi>=st.n)finishSprint(false);else{saveSes();render();window.scrollTo(0,0)}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;if(el.dataset.ch==='bookTest')UI.booktest=el.value;else if(el.dataset.ch==='errC'){const st=cur();const e2=st.errs[el.dataset.q]||(st.errs[el.dataset.q]={cid:'',cause:''});e2.cid=el.value;saveSes()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='ans'){e.preventDefault();warmSubmit()}});
setInterval(()=>{if(!SES)return;const st=cur();if(!st)return;const c=$('#clock');if(c){const ci=clockInfo();c.textContent=ci.t;c.classList.toggle('warn',ci.w)}
  if(st.k==='sprint'&&st.phase==='run'&&Date.now()-st.start>=st.dur)finishSprint(true);
  if(st.k==='book'&&st.phase==='run'){const rem=(st.dur-(Date.now()-st.start))/1000;for(const th of [600,300,120]){if(rem<=th&&rem>th-30&&!st.al[th]){st.al[th]=1;toast(`Il reste ${th/60} minutes`);saveSes()}}if(rem<=0){st.phase='key';toast('Temps écoulé');saveSes();render()}}
  if(st.k==='warm'&&st.start&&!st.done&&!st.busy&&Date.now()-st.start>=st.dur*1000)finishWarm();
},500);
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if($('#scr'))initScratch()},200)});
applyTheme();render();initSync();
</script>
</body>
</html>
