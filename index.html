CONCEPTS.push(
{id:'comp-methode',sub:'comp',bloc:'Méthode',title:'La méthode de lecture',book:'p. 42 à 49 (stratégie en 5 étapes, méthode de l’entonnoir)',
intuition:`En 20 minutes, un texte long et 15 questions : impossible de tout lire deux fois. On lit <b>une seule fois, activement</b>, en repérant la structure (thèse, arguments, exemples, concessions), puis on revient au texte de façon ciblée pour chaque question.`,
regle:`<ol><li>Survoler : titre, première phrase de chaque paragraphe, conclusion</li><li>Lire activement en notant l’idée de chaque paragraphe en 3 à 5 mots</li><li>Pour chaque question, identifier son type, puis retourner au passage concerné</li><li>Formuler sa propre réponse avant de lire les propositions</li><li>Éliminer : chaque mauvaise proposition a un défaut précis</li></ol>`,
ex:{enonce:'« Beaucoup pensent que le télétravail isole. Pourtant, les études récentes montrent que les salariés à distance échangent davantage par écrit. Encore faut-il que ces échanges soient de qualité. » Quelle est l’idée de ce paragraphe ?',steps:['« Beaucoup pensent que… » introduit une opinion que l’auteur va discuter.','« Pourtant » marque le vrai propos : les échanges ne disparaissent pas, ils changent de forme.','« Encore faut-il… » ajoute une nuance. Idée : le télétravail n’isole pas forcément, à condition que les échanges soient de qualité.']},
trou:{enonce:'Un paragraphe commence par « Certes, la croissance a créé des emplois » et se poursuit par « mais ces emplois sont de plus en plus précaires ». Quelle idée noter ?',steps:['« Certes » annonce une concession : l’auteur reconnaît un point avant de le nuancer.','« Mais » introduit l’idée que l’auteur défend.','Note : « emplois créés, mais précaires ».'],blank:1,choices:['« Mais » introduit l’idée que l’auteur défend.','« Mais » introduit un exemple secondaire.','« Mais » annonce la conclusion du texte entier.'],ok:0},
pieges:['Lire le texte deux fois en entier : il ne reste plus assez de temps pour les questions.','Répondre de mémoire sans retourner au passage : les propositions sont conçues pour ressembler à un souvenir approximatif.','Confondre l’opinion que l’auteur rapporte avec celle qu’il défend.'],
reflexe:'« Certes », « pourtant », « en réalité », « or » signalent presque toujours la position de l’auteur. Repère-les en lisant.',
cartes:[['Que signale « certes… mais » ?','Une concession : ce qui suit « mais » est la position de l’auteur.'],['Avant de lire les propositions, que faire ?','Formuler sa propre réponse à partir du texte.'],['« Beaucoup pensent que… » introduit souvent… ?','Une opinion que l’auteur va contester ou nuancer.'],['Comment lire un texte long efficacement ?','Une lecture active en notant l’idée de chaque paragraphe, puis des retours ciblés.']]},
{id:'comp-questions',sub:'comp',bloc:'Méthode',title:'Les types de questions',book:'p. 40 à 45',pre:['comp-methode'],
intuition:`Chaque question appartient à une famille, et chaque famille a sa méthode. Reconnaître la famille en lisant la question fait gagner du temps : on sait où chercher et quel piège attendre.`,
regle:`<ul><li><b>Idée principale</b> : la réponse couvre tout le texte, ni trop large ni trop étroite</li><li><b>Détail</b> (« selon le texte ») : la réponse est écrite, presque mot pour mot, dans un passage précis</li><li><b>Sens d’un mot</b> : relire la phrase entière et remplacer le mot par chaque proposition</li><li><b>Inférence</b> (« on peut déduire ») : ce n’est pas écrit, mais c’est forcément vrai si le texte est vrai</li><li><b>Intention, ton</b> : pourquoi l’auteur écrit ce passage (critiquer, nuancer, illustrer)</li></ul>`,
ex:{enonce:'Texte : « Les abeilles sauvages pollinisent certaines cultures mieux que les abeilles domestiques. » Question : « On peut déduire du texte que… »',steps:['« Déduire » signale une question d’inférence.','On cherche ce qui est forcément vrai si la phrase est vraie, sans rien ajouter.','Acceptable : « pour certaines cultures, les abeilles domestiques ne sont pas les meilleures pollinisatrices ». Pas : « les abeilles domestiques sont inutiles ».']},
trou:{enonce:'« L’hiver a été clément : peu de gel, peu de neige. » Question : « Le mot clément signifie… »',steps:['C’est une question de sens d’un mot : on relit toute la phrase.','La suite (« peu de gel, peu de neige ») explique le mot.','« Clément » signifie ici « doux, peu rigoureux ».'],blank:1,choices:['La suite (« peu de gel, peu de neige ») explique le mot.','On choisit le sens le plus courant du mot.','On cherche un mot de la même famille.'],ok:0},
pieges:['Choisir, pour une idée principale, une réponse vraie mais qui ne concerne qu’un paragraphe.','Pour une inférence, choisir une réponse qui va plus loin que le texte (« toujours », « tous »).','Pour un mot, prendre son sens habituel alors que le contexte en impose un autre.'],
reflexe:'Lis la question et nomme sa famille en un mot : idée, détail, mot, déduction, intention. Tu sais alors où chercher.',
cartes:[['Question « selon le texte » ?','Détail : la réponse est écrite dans un passage précis.'],['Question « on peut déduire » ?','Inférence : forcément vrai si le texte est vrai, sans rien ajouter.'],['Idée principale : quels défauts éliminer ?','Trop étroite (un seul paragraphe) ou trop large (au-delà du texte).'],['Sens d’un mot : méthode ?','Relire la phrase et remplacer le mot par chaque proposition.']]},
{id:'comp-pieges',sub:'comp',bloc:'Méthode',title:'Les pièges des propositions',book:'p. 42 à 49',pre:['comp-methode'],
intuition:`Au TAGE, les mauvaises propositions ne sont pas choisies au hasard : chacune repose sur un défaut précis. Connaître ces défauts permet d’éliminer vite, même sans être sûre de la bonne réponse.`,
regle:`<ul><li><b>Trop absolue</b> : « toujours », « jamais », « tous », « uniquement » alors que le texte nuance</li><li><b>Hors texte</b> : vraie dans la réalité, mais absente du texte</li><li><b>Inversée</b> : reprend les mots du texte en retournant la relation (cause et effet, pour et contre)</li><li><b>Déformée</b> : un détail changé (un chiffre, une cause, un acteur)</li><li><b>Vraie mais hors sujet</b> : exacte, mais ne répond pas à la question posée</li></ul>`,
ex:{enonce:'Texte : « Le sommeil favorise la mémorisation. » Proposition : « La mémorisation améliore le sommeil. »',steps:['La proposition reprend les deux mêmes mots.','Mais elle retourne la relation : la cause devient l’effet.','Piège de l’inversion : à éliminer.']},
trou:{enonce:'Texte : « Plusieurs villes européennes ont réduit leur trafic automobile. » Proposition : « Toutes les villes européennes ont réduit leur trafic. »',steps:['Le texte dit « plusieurs ».','La proposition dit « toutes » : elle généralise.','Piège de la proposition trop absolue : à éliminer.'],blank:2,choices:['Piège de la proposition trop absolue : à éliminer.','Reformulation fidèle : à garder.','Piège hors texte : à éliminer.'],ok:0},
pieges:['Garder une proposition parce qu’elle contient les mêmes mots que le texte : c’est souvent un piège d’inversion.','Choisir ce qu’on sait vrai dans la réalité plutôt que ce que dit le texte.'],
reflexe:'Repère les mots absolus dans les propositions (tous, jamais, uniquement, toujours) : ils sont suspects neuf fois sur dix.',
cartes:[['Piège d’inversion ?','Mêmes mots que le texte, relation retournée.'],['Piège hors texte ?','Vrai dans la réalité, mais absent du texte.'],['Mots suspects dans une proposition ?','Tous, toujours, jamais, uniquement, seul.'],['Proposition vraie mais hors sujet ?','Exacte, mais ne répond pas à la question : à éliminer.']]},

{id:'ra-formelle',sub:'raison',bloc:'Raisonnement',title:'Logique formelle',book:'p. 236',
intuition:`« Si A, alors B » ne dit rien de ce qui se passe quand A est faux. De « si A alors B », on peut seulement tirer deux conclusions : A donne B, et non B donne non A (la contraposée). Les deux erreurs classiques consistent à remonter de B vers A, ou à conclure non B à partir de non A.`,
regle:`<ul><li>Si A alors B, et A : donc B (valide)</li><li>Si A alors B, et non B : donc non A (contraposée, valide)</li><li>Si A alors B, et B : rien sur A (piège)</li><li>Si A alors B, et non A : rien sur B (piège)</li><li>« A seulement si B » se lit « si A, alors B » : B est une condition nécessaire, A une condition suffisante</li></ul>`,
ex:{enonce:'« S’il pleut, le match est annulé. » Le match n’est pas annulé. Que peut-on conclure ?',steps:['Forme : si A (il pleut), alors B (annulé).','On sait non B : le match n’est pas annulé.','Contraposée : non B donne non A. Il ne pleut pas.']},
trou:{enonce:'« Si Léa réussit, elle part en vacances. » Léa part en vacances. Que peut-on conclure ?',steps:['Forme : si A (réussit), alors B (vacances).','On sait B.','On ne peut rien conclure : elle peut partir pour une autre raison.'],blank:2,choices:['On ne peut rien conclure : elle peut partir pour une autre raison.','Léa a réussi.','Léa n’a pas réussi.'],ok:0},
pieges:['Remonter de la conséquence à la condition : de « si A alors B » et B, conclure A.','Conclure non B à partir de non A.','Confondre condition nécessaire et condition suffisante.'],
reflexe:'Traduis toujours en « si A alors B », puis ne garde que deux conclusions possibles : A donne B, non B donne non A.',
cartes:[['Contraposée de « si A alors B » ?','Si non B, alors non A.'],['« Si A alors B » et B : conclusion ?','Aucune sur A.'],['« A seulement si B » ?','Si A, alors B (B est nécessaire).'],['« Si A alors B » et non A : conclusion ?','Aucune sur B.']]},
{id:'ra-quantif',sub:'raison',bloc:'Raisonnement',title:'Tous, certains, aucun',book:'p. 236',pre:['ra-formelle'],
intuition:`Les phrases en « tous », « certains » et « aucun » se dessinent : des cercles inclus les uns dans les autres, qui se chevauchent ou qui ne se touchent pas. Une conclusion est certaine seulement si elle est vraie dans <b>tous</b> les dessins possibles.`,
regle:`<ul><li>Tous les A sont B, tous les B sont C : tous les A sont C</li><li>Aucun B n’est C, tous les A sont B : aucun A n’est C</li><li>Tous les B sont C, certains A sont B : certains A sont C</li><li>« Tous les A sont B » ne dit pas que tous les B sont A</li><li>Deux « certains » ne permettent aucune conclusion</li><li>Le contraire de « tous sont » est « certains ne sont pas »</li></ul>`,
ex:{enonce:'Tous les pianistes sont musiciens. Certains étudiants sont pianistes. Que peut-on conclure ?',steps:['On dessine le cercle des pianistes dans celui des musiciens.','Certains étudiants sont dans le cercle des pianistes, donc aussi dans celui des musiciens.','Conclusion certaine : certains étudiants sont musiciens.']},
trou:{enonce:'Tous les chats sont des mammifères. Certains mammifères nagent. Peut-on conclure que certains chats nagent ?',steps:['Le cercle des chats est dans celui des mammifères.','Les mammifères qui nagent peuvent se trouver en dehors du cercle des chats.','Aucune conclusion certaine sur les chats.'],blank:1,choices:['Les mammifères qui nagent peuvent se trouver en dehors du cercle des chats.','Les mammifères qui nagent sont forcément des chats.','Tous les mammifères sont des chats.'],ok:0},
pieges:['Retourner une phrase en « tous » : tous les A sont B ne dit pas que tous les B sont A.','Combiner deux « certains » pour en tirer une conclusion.'],
reflexe:'Dessine trois cercles en quelques secondes, et cherche un dessin qui contredit la conclusion proposée : si tu en trouves un, elle n’est pas certaine.',
cartes:[['Tous les A sont B : les B sont-ils tous A ?','Non, pas forcément.'],['Contraire de « tous les A sont B » ?','Certains A ne sont pas B.'],['Deux « certains » : conclusion ?','Aucune.'],['Aucun A n’est B : et aucun B n’est A ?','Oui, c’est équivalent.']]},
{id:'ra-menteurs',sub:'raison',bloc:'Raisonnement',title:'Menteurs et vérité',book:'p. 238 à 241',pre:['ra-formelle'],
intuition:`Dans ces énigmes, chacun dit toujours vrai ou ment toujours. La méthode : faire une hypothèse sur une personne, en dérouler les conséquences, et ne garder que l’hypothèse qui ne crée aucune contradiction.`,
regle:`<ol><li>Chercher deux affirmations qui s’opposent : l’une des deux personnes ment forcément</li><li>Faire une hypothèse (« A dit vrai ») et en tirer les conséquences</li><li>Une contradiction élimine l’hypothèse</li><li>Un menteur qui dit « X ment » signifie que X dit vrai</li></ol>`,
ex:{enonce:'Anna : « Bruno ment. » Bruno : « Anna et moi disons la vérité. » Qui dit vrai ?',steps:['Hypothèse : Anna dit vrai. Alors Bruno ment, et sa phrase est fausse : c’est cohérent.','Hypothèse : Anna ment. Alors Bruno dit vrai, donc Anna dit vrai : contradiction.','Anna dit vrai, Bruno ment.']},
trou:{enonce:'Chloé dit : « Je mens. » Est-ce possible dans ce type d’énigme ?',steps:['Si Chloé dit vrai, alors elle ment : contradiction.','Si Chloé ment, « je mens » est faux, donc elle dit vrai : contradiction.','Personne ne peut dire « je mens » dans ce type d’énigme.'],blank:1,choices:['Si Chloé ment, « je mens » est faux, donc elle dit vrai : contradiction.','Si Chloé ment, c’est cohérent.','Si Chloé ment, on ne peut rien dire.'],ok:0},
pieges:['Oublier que « A et B disent vrai » est faux dès qu’un seul des deux ment.','Tester une seule hypothèse : il faut vérifier que c’est la seule cohérente.'],
reflexe:'Commence par la personne dont la phrase porte sur le plus de monde : elle crée vite des contradictions.',
cartes:[['Un menteur dit « X ment » : qu’en déduire ?','X dit vrai.'],['« A et B disent vrai » est faux quand… ?','Au moins l’un des deux ment.'],['Méthode générale ?','Hypothèse, conséquences, élimination des contradictions.'],['« Au moins l’un de nous ment », dit par un menteur ?','Ce serait faux, donc personne ne mentirait : contradiction. Celui qui le dit dit donc vrai.']]},
{id:'ra-placements',sub:'raison',bloc:'Raisonnement',title:'Placements et classements',book:'p. 246 à 251',
intuition:`Ces énigmes se résolvent en dessinant : une ligne de cases numérotées, où l’on place d’abord les indices les plus contraignants.`,
regle:`<ol><li>Dessiner les places : 1, 2, 3, 4, 5</li><li>Placer d’abord les informations certaines (« X est à la 3e place »)</li><li>Puis les blocs (« X arrive juste avant Y »)</li><li>Puis les relations (« X arrive avant Y »)</li><li>Les négations en dernier, pour trancher entre les possibilités restantes</li></ol>`,
ex:{enonce:'Quatre coureurs : Ali, Bea, Cyril, Dina. Bea est 2e. Ali arrive juste après Bea. Dina n’est pas dernière. Qui est 4e ?',steps:['Bea est 2e : on la place.','Ali juste après Bea : Ali est 3e.','Restent les places 1 et 4. Dina n’est pas dernière : Dina 1re, Cyril 4e.']},
trou:{enonce:'Trois amis : Eva, Farid, Gil. Eva arrive avant Farid. Gil arrive après Farid. Qui est 1er ?',steps:['Eva avant Farid.','Gil après Farid.','Ordre : Eva, Farid, Gil. Eva est 1re.'],blank:2,choices:['Ordre : Eva, Farid, Gil. Eva est 1re.','Ordre : Farid, Eva, Gil. Farid est 1er.','On ne peut pas savoir.'],ok:0},
pieges:['Confondre « avant » et « juste avant » : seul « juste avant » impose deux places voisines.','S’arrêter à une solution possible sans vérifier qu’elle est la seule.'],
reflexe:'Commence toujours par l’indice le plus précis : une place exacte, puis un bloc « juste avant ».',
cartes:[['Premier indice à utiliser ?','Une place exacte.'],['« Juste avant » impose… ?','Deux places voisines.'],['Les négations (« X n’est pas 1er ») ?','En dernier, pour trancher.']]},
{id:'ra-conclusion',sub:'raison',bloc:'Argumentation',title:'Conclusion et présupposé',book:'p. 278 à 283',
intuition:`Un argument, c’est une conclusion soutenue par des prémisses. Le présupposé est la prémisse cachée : ce que l’auteur tient pour acquis sans le dire, et sans quoi son raisonnement s’effondre.`,
regle:`<ul><li>Conclusion : ce que l’auteur veut faire admettre, souvent après « donc », « c’est pourquoi », « il faut »</li><li>Prémisses : les raisons, souvent après « car », « puisque », « en effet »</li><li>Présupposé : test de la négation. Si le nier fait tomber l’argument, c’est bien un présupposé</li><li>Une bonne conclusion ne dit rien de plus que ce que le texte permet</li></ul>`,
ex:{enonce:'« Ce restaurant est toujours plein, il doit donc être excellent. » Quel est le présupposé ?',steps:['Conclusion : le restaurant est excellent. Prémisse : il est toujours plein.','Il manque un lien : un restaurant plein est un bon restaurant.','Test de la négation : si l’affluence ne disait rien de la qualité, l’argument tomberait. C’est le présupposé.']},
trou:{enonce:'« Il faut baisser le prix des billets de train pour que plus de gens délaissent la voiture. » Quel est le présupposé ?',steps:['Conclusion : il faut baisser le prix des billets.','Le lien caché : le prix influence le choix entre train et voiture.','Test de la négation : si le prix ne comptait pas, baisser les billets ne changerait rien.'],blank:1,choices:['Le lien caché : le prix influence le choix entre train et voiture.','Le lien caché : le train est plus rapide que la voiture.','Le lien caché : la voiture pollue davantage.'],ok:0},
pieges:['Choisir comme présupposé une affirmation vraie mais inutile au raisonnement.','Choisir une conclusion plus forte que ce que permet le texte.'],
reflexe:'Pour un présupposé, nie la proposition : si l’argument s’effondre, c’est la bonne.',
cartes:[['Test du présupposé ?','Le nier : si l’argument tombe, c’est un présupposé.'],['Mots qui annoncent une conclusion ?','Donc, c’est pourquoi, il faut, par conséquent.'],['Mots qui annoncent une prémisse ?','Car, puisque, en effet, étant donné que.']]},
{id:'ra-renforcer',sub:'raison',bloc:'Argumentation',title:'Renforcer et affaiblir',book:'p. 284 à 289',pre:['ra-conclusion'],
intuition:`Pour renforcer ou affaiblir un argument, on vise le <b>lien</b> entre la prémisse et la conclusion, pas la conclusion elle-même. Une information qui écarte une autre explication renforce ; une information qui en propose une autre affaiblit.`,
regle:`<ul><li>Repérer la conclusion et le lien supposé, souvent une cause</li><li>Renforcer : confirmer le lien, écarter une autre explication (par exemple avec un groupe de comparaison)</li><li>Affaiblir : proposer une autre cause, un contre-exemple, un biais</li><li>Corrélation n’est pas causalité : deux choses qui évoluent ensemble peuvent avoir une cause commune</li></ul>`,
ex:{enonce:'« Les salariés qui déjeunent à la cantine sont plus productifs. Donc la cantine rend productif. » Qu’est-ce qui affaiblit le plus ?',steps:['Conclusion : la cantine cause la productivité.','Autre explication possible : ce sont les salariés aux horaires les plus réguliers qui déjeunent à la cantine.','Proposer une autre cause affaiblit le lien : c’est l’affaiblissement le plus fort.']},
trou:{enonce:'« Depuis que le lycée propose du soutien, les résultats ont augmenté. Le soutien est donc efficace. » Qu’est-ce qui renforce le plus ?',steps:['Conclusion : le soutien cause la hausse.','Il faut écarter une autre explication.','Renforce : « Dans les lycées voisins sans soutien, les résultats n’ont pas bougé. »'],blank:2,choices:['Renforce : « Dans les lycées voisins sans soutien, les résultats n’ont pas bougé. »','Renforce : « Les élèves apprécient le soutien. »','Renforce : « Le soutien coûte cher au lycée. »'],ok:0},
pieges:['Choisir une information qui répète la conclusion sans agir sur le lien.','Choisir une information intéressante mais sur un autre sujet.'],
reflexe:'Pour affaiblir, cherche la proposition qui apporte une autre cause. Pour renforcer, celle qui en élimine une.',
cartes:[['Affaiblir un lien de cause ?','Proposer une autre cause, ou un contre-exemple.'],['Renforcer un lien de cause ?','Écarter une explication concurrente, par exemple avec un groupe de comparaison.'],['Corrélation et causalité ?','Deux faits liés peuvent avoir une cause commune.']]},

{id:'exp-pp',sub:'exp',bloc:'Grammaire',title:'Accord du participe passé',book:'p. 426',
intuition:`Avec <b>être</b>, le participe s’accorde avec le sujet. Avec <b>avoir</b>, il ne s’accorde jamais avec le sujet, mais avec le complément d’objet direct s’il est placé <b>avant</b> le verbe.`,
regle:`<ul><li>Être : accord avec le sujet. « Elles sont parties. »</li><li>Avoir : accord avec le COD placé avant. « Les lettres que j’ai écrites. »</li><li>Avoir, COD après ou absent : pas d’accord. « J’ai écrit des lettres. »</li><li>Pronominal : accord avec le COD placé avant. « Elle s’est lavée », mais « Elle s’est lavé les mains »</li><li>Astuce : un verbe comme écrire ou prendre fait entendre l’accord (écrit, écrite)</li></ul>`,
ex:{enonce:'« Les photos que tu m’as ___ sont superbes. » (envoyer)',steps:['Auxiliaire avoir : on cherche le COD.','Tu m’as envoyé quoi ? « que », mis pour « les photos », placé avant le verbe.','COD féminin pluriel placé avant : « envoyées ».']},
trou:{enonce:'« Elle s’est ___ les cheveux. » (couper)',steps:['Verbe pronominal : on cherche le COD.','Elle a coupé quoi ? « les cheveux », placé après le verbe.','COD après : pas d’accord, « coupé ».'],blank:1,choices:['Elle a coupé quoi ? « les cheveux », placé après le verbe.','Le sujet est « elle » : on accorde au féminin.','« se » est le COD, placé avant.'],ok:0},
pieges:['Accorder avec le sujet quand l’auxiliaire est avoir.','Accorder un pronominal quand le COD est placé après : « elle s’est lavé les mains ».'],
reflexe:'Avec avoir, pose la question « quoi ? » après le verbe : si la réponse est avant, on accorde ; si elle est après, on n’accorde pas.',
cartes:[['Accord avec être ?','Avec le sujet.'],['Accord avec avoir ?','Avec le COD s’il est placé avant.'],['« Les fleurs qu’il a ___ » (cueillir) ?','Cueillies.'],['« Elle s’est lavé les mains » : pourquoi pas d’accord ?','Le COD (les mains) est après le verbe.']]},
{id:'exp-modes',sub:'exp',bloc:'Grammaire',title:'Modes et concordance',book:'p. 418 à 425',
intuition:`Certaines conjonctions imposent un mode. « Bien que », « pour que », « avant que » demandent le subjonctif ; « après que », « parce que », « pendant que » demandent l’indicatif. Et « si » n’est jamais suivi du conditionnel.`,
regle:`<ul><li>Subjonctif : bien que, quoique, pour que, afin que, avant que, sans que, à moins que, il faut que</li><li>Indicatif : après que, parce que, pendant que, tandis que, alors que</li><li>Si + présent, puis futur : « S’il pleut, je resterai. »</li><li>Si + imparfait, puis conditionnel présent : « S’il pleuvait, je resterais. »</li><li>Si + plus-que-parfait, puis conditionnel passé : « S’il avait plu, je serais resté. »</li></ul>`,
ex:{enonce:'« Bien qu’il ___ tard, elle continue de travailler. » (être)',steps:['« Bien que » impose le subjonctif.','Subjonctif présent de être : « qu’il soit ».','« Bien qu’il soit tard ».']},
trou:{enonce:'« Si j’___ le temps, je viendrais. » (avoir)',steps:['La principale est au conditionnel présent (« viendrais »).','Si + imparfait, conditionnel dans la principale.','« Si j’avais le temps ».'],blank:1,choices:['Si + imparfait, conditionnel dans la principale.','Si + conditionnel, comme dans la principale.','Si + subjonctif, comme après « bien que ».'],ok:0},
pieges:['« Si j’aurais su » : jamais de conditionnel après « si ».','« Après qu’il soit parti » : « après que » demande l’indicatif (« après qu’il est parti »).'],
reflexe:'Retiens la paire piège : avant que + subjonctif, après que + indicatif.',
cartes:[['Bien que + … ?','Subjonctif.'],['Après que + … ?','Indicatif.'],['Si + imparfait, puis… ?','Conditionnel présent.'],['« Si j’aurais su » ?','Faux : « si j’avais su ».']]},
{id:'exp-homophones',sub:'exp',bloc:'Orthographe',title:'Homophones grammaticaux',book:'p. 428 à 431',
intuition:`Ces mots se prononcent de la même façon mais ne jouent pas le même rôle. Le test de remplacement suffit presque toujours : on remplace par un autre mot et on regarde si la phrase tient.`,
regle:`<ul><li><b>a / à</b> : « a » se remplace par « avait »</li><li><b>ou / où</b> : « ou » se remplace par « ou bien » ; « où » indique un lieu ou un moment</li><li><b>quoique / quoi que</b> : quoique = bien que ; quoi que = quelle que soit la chose que</li><li><b>quel que / quelque</b> : quel que devant être, accordé ; quelque = quelques-uns, ou « environ »</li><li><b>leur / leurs</b> : devant un verbe, « leur » est invariable</li><li><b>près / prêt</b> : près de = à côté ; prêt à = préparé</li></ul>`,
ex:{enonce:'« ___ tu fasses, fais-le bien. »',steps:['Test : « bien que tu fasses » n’a pas de sens ici.','On peut dire « quelle que soit la chose que tu fasses ».','Il faut « quoi que », en deux mots.']},
trou:{enonce:'« ___ soient tes raisons, explique-toi. »',steps:['Le mot est suivi du verbe être (« soient »).','Devant être, on écrit « quel que », accordé avec le sujet.','« Raisons » est féminin pluriel : « quelles que ».'],blank:1,choices:['Devant être, on écrit « quel que », accordé avec le sujet.','Devant être, on écrit « quelque » en un mot.','Devant être, on écrit « quelques ».'],ok:0},
pieges:['« Quelque soit » : devant être, c’est toujours « quel que », accordé.','« Je leurs parle » : devant un verbe, « leur » ne prend jamais de s.'],
reflexe:'Remplace : « a » par « avait », « ou » par « ou bien », « quoique » par « bien que ». Si ça marche, c’est la forme simple.',
cartes:[['« a » ou « à » ?','« a » si on peut dire « avait ».'],['Quoique ou quoi que ?','Quoique = bien que ; quoi que = quelle que soit la chose que.'],['Devant être : quel que ou quelque ?','Quel que, accordé : « quelles que soient ».'],['« Je leur parle » : leur ou leurs ?','Leur, invariable devant un verbe.']]},
{id:'exp-vocab',sub:'exp',bloc:'Vocabulaire',title:'Vocabulaire et paronymes',book:'p. 456 et p. 476 à 479',
intuition:`Au TAGE, les questions de vocabulaire portent souvent sur des mots soutenus et sur des <b>paronymes</b> : des mots presque identiques qui n’ont pas le même sens, comme conjecture et conjoncture. Pour un mot inconnu, le contexte et la famille du mot aident beaucoup.`,
regle:`<ul><li>Conjecture (hypothèse) / conjoncture (situation d’ensemble)</li><li>Éminent (remarquable) / imminent (sur le point d’arriver)</li><li>Prolixe (bavard) / prolifique (qui produit beaucoup)</li><li>Acception (sens d’un mot) / acceptation (fait d’accepter)</li><li>Effraction (entrer en forçant) / infraction (violation d’une règle)</li><li>Prodige (personne douée) / prodigue (qui dépense sans compter)</li></ul>`,
ex:{enonce:'« La réunion est ___ : elle commence dans deux minutes. » Éminente ou imminente ?',steps:['Le contexte : « dans deux minutes », donc sur le point d’arriver.','Éminent veut dire remarquable ; imminent, sur le point d’arriver.','« La réunion est imminente ».']},
trou:{enonce:'« Il m’a fait une réponse laconique. » Que signifie « laconique » ?',steps:['Une réponse peut être longue, courte, polie…','Laconique vient des Laconiens, les Spartiates, réputés pour parler peu.','« Laconique » signifie « brève, en peu de mots ».'],blank:2,choices:['« Laconique » signifie « brève, en peu de mots ».','« Laconique » signifie « impolie ».','« Laconique » signifie « ironique ».'],ok:0},
pieges:['Confondre deux paronymes parce qu’ils se ressemblent.','Choisir un sens proche par le thème mais pas par le sens : prolixe n’est pas prolifique.'],
reflexe:'Remplace le mot par chaque proposition dans la phrase : le bon sens ne change pas la phrase.',
cartes:[['Conjecture / conjoncture ?','Hypothèse / situation d’ensemble.'],['Prolixe ?','Trop long, bavard.'],['Laconique ?','Bref, en peu de mots.'],['Éminent / imminent ?','Remarquable / sur le point d’arriver.'],['Pérenne ?','Durable.']]},
{id:'exp-connecteurs',sub:'exp',bloc:'Vocabulaire',title:'Connecteurs logiques',book:'p. 454',
intuition:`Un connecteur indique la relation entre deux idées : opposition, cause, conséquence, addition, concession. Pour choisir, on nomme d’abord la relation, puis on prend le connecteur qui l’exprime.`,
regle:`<ul><li>Opposition : mais, pourtant, cependant, en revanche, néanmoins</li><li>Cause : car, puisque, en effet, étant donné que</li><li>Conséquence : donc, ainsi, par conséquent, c’est pourquoi</li><li>Addition : de plus, en outre, par ailleurs</li><li>Concession : certes… mais, bien que, même si</li><li>« Or » : introduit un fait nouveau qui fait avancer le raisonnement</li></ul>`,
ex:{enonce:'« Il a beaucoup révisé ; ___, il a échoué. »',steps:['On s’attendait à la réussite, le résultat est contraire.','C’est une opposition.','« Pourtant » convient.']},
trou:{enonce:'« Le magasin était fermé ; ___, nous sommes rentrés. »',steps:['La fermeture explique le retour.','Relation de conséquence.','« Par conséquent » convient.'],blank:1,choices:['Relation de conséquence.','Relation d’opposition.','Relation d’addition.'],ok:0},
pieges:['« En effet » introduit une explication (une cause), pas une conséquence.','Choisir un connecteur d’opposition quand la phrase ajoute simplement une information.'],
reflexe:'Nomme la relation en un mot avant de regarder les propositions.',
cartes:[['« En effet » exprime… ?','Une cause, une explication.'],['« Par conséquent » exprime… ?','Une conséquence.'],['« En revanche » exprime… ?','Une opposition.'],['« En outre » exprime… ?','Une addition.']]},
{id:'exp-ortho',sub:'exp',bloc:'Orthographe',title:'Mots difficiles',book:'p. 430 à 437',
intuition:`Certains mots sont des pièges classiques : doubles consonnes, accents, terminaisons. Au TAGE, on te demande souvent de repérer le seul mot mal orthographié parmi cinq. La mémoire visuelle se travaille : c’est exactement le rôle de la répétition espacée.`,
regle:`<ul><li>Doubles consonnes : occurrence, accueil, rationnel, personnellement</li><li>Pièges : dilemme (deux m, pas de n), développement (un l, deux p), succinct (avec un c final)</li><li>Adverbes : adjectif en -ent, adverbe en -emment (évidemment) ; en -ant, -amment (couramment)</li><li>Ordre des lettres : accueil (u avant e après deux c)</li><li>Faux amis de l’anglais : connexion (et non connection)</li></ul>`,
ex:{enonce:'Quel mot est mal écrit : occurrence, dilemme, apparament, développement, rationnel ?',steps:['On vérifie les pièges connus : doubles consonnes et adverbes.','« Apparent » finit par -ent, donc l’adverbe s’écrit « apparemment ».','Le mot fautif est « apparament ».']},
trou:{enonce:'« Évidament » ou « évidemment » ?',steps:['« Évident » finit par -ent.','Adjectif en -ent : adverbe en -emment.','« Évidemment ».'],blank:1,choices:['Adjectif en -ent : adverbe en -emment.','Adjectif en -ent : adverbe en -ament.','On double toujours le m.'],ok:0},
pieges:['« Dilemne » au lieu de « dilemme ».','« Rationel » au lieu de « rationnel » (mais « rationalité » avec un seul n).'],
reflexe:'Adjectif en -ent : adverbe en -emment ; en -ant : -amment (constant, constamment).',
cartes:[['Adverbe de « évident » ?','Évidemment.'],['Adverbe de « courant » ?','Couramment.'],['Dilemme : combien de m ?','Deux, et pas de n.'],['Connexion ou connection ?','Connexion.']]}
);

/* ============ Sauvegarde locale ============ */
const KEY='tm-ml-v1',SKEY='tm-ml-ses';
let storageOK=true;
function blank(){return {v:1,cards:{},studied:{},newLog:{},reviews:[],sprints:[],sessions:[],book:[],errs:[],journal:[],blancs:[],plan:null,diag:null,recent:{},settings:{newPerDay:2,len:30,theme:'auto'},intro:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const b=blank();return Object.assign(b,o,{settings:Object.assign(b.settings,o.settings||{})})}}catch(e){storageOK=false}return blank()}
let S=load();
function trimS(){if(S.reviews.length>1600)S.reviews=S.reviews.slice(-1200);if(S.sprints.length>150)S.sprints=S.sprints.slice(-120);if(S.sessions.length>400)S.sessions=S.sessions.slice(-300)}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
function save(){trimS();S.updated=Date.now();saveLocal();schedulePush()}

/* ============ Synchronisation entre appareils (Firebase) ============ */

   Tant qu’elle reste à null, l’app fonctionne en local sur chaque appareil. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBi2AePhYDRm-4D16jmrnxTrTS3scRms2k",
  authDomain: "tagemagelouisot.firebaseapp.com",
  projectId: "tagemagelouisot",

  messagingSenderId: "163488262165",
  appId: "1:163488262165:web:73fc558324c0cdc9e5861c"
};

const SYNC={state:'local',ref:null,timer:null,pending:null,key:null};
function readKey(){const m=(location.hash||'').match(/k=([a-f0-9]{32,64})/);if(m){try{localStorage.setItem('tm-key',m[1])}catch(e){}return m[1]}try{return localStorage.getItem('tm-key')}catch(e){return null}}
function personalLink(){return SYNC.key?location.origin+location.pathname+'#k='+SYNC.key:''}
function newKey(){const a=new Uint8Array(20);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function schedulePush(){if(!SYNC.ref)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,1500)}
function pushNow(){if(!SYNC.ref)return;clearTimeout(SYNC.timer);
  SYNC.ref.set({json:JSON.stringify(S),updated:S.updated||Date.now()}).then(()=>{if(SYNC.state!=='sync'){SYNC.state='sync';if(typeof render==='function'&&!SES)render()}}).catch(()=>{SYNC.state='error';setTimeout(pushNow,8000)})}
function adopt(r){const b=blank();S=Object.assign(b,r,{settings:Object.assign(b.settings,r.settings||{})});buildDefs();saveLocal();if(typeof applyTheme==='function')applyTheme()}
function parseRemote(snap){try{const d=snap&&snap.exists?snap.data():null;return d&&typeof d.json==='string'?JSON.parse(d.json):null}catch(e){return null}}
async function initSync(){
  SYNC.key=readKey();
  if(!FIREBASE_CONFIG){SYNC.state='noconfig';return}
  if(!SYNC.key){SYNC.state='nokey';render();return}
  if(!/k=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search+'#k='+SYNC.key);
  try{
    SYNC.state='connecting';render();
    if(!window.firebase){await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js')}
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(FIREBASE_CONFIG);
    SYNC.ref=app.firestore().collection('progress').doc(SYNC.key);
    const r=parseRemote(await SYNC.ref.get());
    if(r&&(r.updated||0)>(S.updated||0)){adopt(r);SYNC.state='sync'}
    else if(S.updated||Object.keys(S.cards).length)pushNow();
    else SYNC.state='sync';
    SYNC.ref.onSnapshot(snap=>{if(snap.metadata&&snap.metadata.hasPendingWrites)return;const r2=parseRemote(snap);if(!r2||(r2.updated||0)<=(S.updated||0))return;if(SES){SYNC.pending=r2}else{adopt(r2);render()}},()=>{SYNC.state='error';render()});
    if(!SES)render();
  }catch(e){SYNC.state='error';render()}
}
function createSpace(){SYNC.key=newKey();try{localStorage.setItem('tm-key',SYNC.key)}catch(e){}history.replaceState(null,'',location.pathname+location.search+'#k='+SYNC.key);initSync()}
function applyPending(){if(SYNC.pending&&(SYNC.pending.updated||0)>(S.updated||0))adopt(SYNC.pending);SYNC.pending=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pushNow()});
let SES=null;
function saveSes(){try{if(SES)localStorage.setItem(SKEY,JSON.stringify(SES));else localStorage.removeItem(SKEY)}catch(e){}}
function loadSes(){try{const r=localStorage.getItem(SKEY);if(r){const o=JSON.parse(r);if(Date.now()-o.start<8*3600e3)return o;localStorage.removeItem(SKEY)}}catch(e){}return null}
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const newToday=()=>S.newLog[dayKey()]||0;

/* ============ Répétition espacée (inspirée de FSRS, l’algorithme d’Anki) ============ */
const DAY=864e5,MIN=6e4;
const initS=g=>[0,0.02,0.25,1,3][g];
const initD=g=>[0,7,6,5,3.5][g];
const retr=(t,s)=>Math.pow(1+t/(9*s),-1);
function nextState(st,g,now=Date.now()){
  st=st||{};let s,d,lapses=st.lapses||0;
  if(!st.reps){s=initS(g);d=initD(g)}
  else{const t=Math.max(0,(now-st.last)/DAY);const r=retr(t,st.s);d=st.d-0.6*(g-3);d=Math.min(10,Math.max(1,0.9*d+0.5));
    if(g===1){s=Math.max(0.02,st.s*0.2);lapses++}

function buildDaily(mins,dry){
  const now=Date.now(),steps=[];let budget=mins*60;
  const studied=studiedList();const skills=studied.filter(c=>c.skill);
  const full=mins>=20;
  if(full&&skills.length){steps.push({k:'warm',dur:180});budget-=180}
  const npd=effNewPerDay();const nc=(full&&newToday()<npd)?nextConcept():null;
  const nc2=(nc&&(!studied.length||npd>=3)&&newToday()+1<npd)?nextConcept(nc):null;
  const doSprint=full&&studied.length>=2&&!lastSessionSprint();
  const revBudget=full?budget-(nc?600:0)-(doSprint?420:0):budget;
  const due=dueList(now);const by={};SUB_ORDER.forEach(s=>by[s]=[]);due.forEach(id=>(by[DEFS[id].sub]||(by[DEFS[id].sub]=[])).push(id));

  let t=0,nrev=0;for(const id of order){const e=est(DEFS[id].type);if(t+e>revBudget&&t>0)break;steps.push(stepFor(id));t+=e;nrev++}
  const remaining=revBudget-t;

  h+=`<p class="small muted" style="margin-top:8px">La rétention mesure la part des révisions réussies. Autour de 85 à 90 %, l’espacement est bien réglé.</p>`;
  const cf={sure:[],mid:[],guess:[]};S.reviews.filter(r=>r.conf&&cf[r.conf]).slice(-200).forEach(r=>cf[r.conf].push(r.ok?1:0));
  const pc=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100)+' %':'?';
  h+=`<h2>Fiabilité de ta confiance</h2><div class="card"><p class="small muted">Quand tu dis être sûre, tu devrais avoir juste presque toujours. Si ce n’est pas le cas, prends l’habitude de vérifier avant de répondre.</p><div class="kpis"><div class="kpi"><b>${pc(cf.sure)}</b><span>justes quand « sûre »</span></div><div class="kpi"><b>${pc(cf.mid)}</b><span>quand « j’hésite »</span></div><div class="kpi"><b>${pc(cf.guess)}</b><span>« au hasard »</span></div></div></div>`;
  const J=S.journal||[];const oe=openErrors().length;
  h+=`<h2>Journal des erreurs</h2><div class="card stack"><p><b>${J.length}</b> erreur${J.length>1?'s':''} notée${J.length>1?'s':''}, dont <b>${oe}</b> à refaire.</p><button class="btn block" data-a="tab" data-t="journal">Ouvrir le journal</button></div>`;
  const BL=(S.blancs||[]).slice(-8).reverse();
  if(BL.length)h+=`<h2>TAGE blancs</h2><div class="card">${BL.map(b=>`<div class="srow2"><div class="top"><span>Test blanc n° ${b.test}, ${fdate(b.t,{day:'numeric',month:'short'})}</span><b class="mono">${b.total} / 600</b></div></div>`).join('')}</div>`;
  if(S.book.length)h+=`<h2>Tests du livre</h2><div class="card">${S.book.slice(-8).reverse().map(b=>`<div class="srow2"><div class="top"><span>${SUBS_SHORT[b.sub]}, ${b.test<=3?'mini-test':'test blanc'} n° ${b.test}</span><b class="mono">${b.score} / 60</b></div></div>`).join('')}</div>`;
  h+=`<h2>Réglages</h2><div class="card stack"><p><b>Nouvelles notions par jour</b><br><span class="small muted">En automatique, le rythme s’adapte à ta date d’examen. Au-delà de 3, les révisions s’accumulent vite.</span></p><div class="chips">${S.plan?`<button class="chip ${S.plan.auto?'on':''}" data-a="setAuto">Auto (${effNewPerDayAuto()})</button>`:''}${[1,2,3,4].map(n=>`<button class="chip ${(!S.plan||!S.plan.auto)&&S.settings.newPerDay===n?'on':''}" data-a="setNew" data-n="${n}">${n}</button>`).join('')}</div><p><b>Apparence</b></p><div class="chips">${[['auto','Automatique'],['light','Clair'],['dark','Sombre']].map(([k,l])=>`<button class="chip ${S.settings.theme===k?'on':''}" data-a="setTheme" data-t="${k}">${l}</button>`).join('')}</div></div>`;

  h+=`<details style="margin-top:22px"><summary>Sur quoi repose la méthode</summary><div class="stack small" style="margin-top:8px"><p><b>Se tester plutôt que relire.</b> Chercher une réponse en mémoire la consolide bien plus qu’une relecture (Roediger et Karpicke, 2006 ; Dunlosky et al., 2013).</p><p><b>La répétition espacée.</b> Chaque carte revient juste avant l’oubli probable, avec une rétention visée d’environ 90 %, sur le modèle de FSRS, l’algorithme d’Anki.</p><p><b>Une carte, une compétence.</b> Les exercices changent de nombres à chaque passage : tu révises la méthode, pas une réponse apprise par cœur.</p><p><b>Le mélange.</b> Alterner les types de problèmes apprend à les reconnaître (Rohrer et Taylor, 2007).</p><p><b>Exemples résolus puis à compléter</b> (Sweller, Renkl), et questions avant la fiche : se tromper avant d’apprendre aide à retenir la correction (Richland, Kornell et Kao, 2009).</p><p><b>La confiance.</b> Une erreur commise avec assurance, une fois corrigée, se retient particulièrement bien (Butterfield et Metcalfe, 2001).</p></div></details>`;
  return h;
}

/* ============ Session ============ */
function blockLabel(st){if(!st)return '';const d=DEFS[st.id];return {warm:'Réflexes',card:d&&d.type==='err'?'Erreur du livre à revoir':'Révision',prob:st.extra?'Exercice mêlé':'Révision',recog:'Reconnaître la méthode',concept:'Nouveau concept',sprint:'Sprint chrono',book:st.blanc?`TAGE blanc, ${SUBS_SHORT[st.sub]}`:'Test du livre',bilan:'Bilan',diag:'Test de positionnement',jq:'Erreur à refaire',blancRes:'Résultat du TAGE blanc'}[st.k]}
function clockInfo(){if(!SES)return {t:'',w:false};const st=SES.steps[SES.i];const mm=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  if(st&&st.k==='sprint'&&st.phase==='run'){const r=(st.dur-(Date.now()-st.start))/1000;return {t:mm(r),w:r<60}}
  if(st&&st.k==='book'&&st.phase==='run'){const r=(st.dur-(Date.now()-st.start))/1000;return {t:mm(r),w:r<120}}
  if(st&&st.k==='warm'&&st.start){const r=st.dur-(Date.now()-st.start)/1000;return {t:mm(r),w:r<15}}
  return {t:mm((Date.now()-SES.start)/1000),w:false}}
function viewSession(){
  const st=SES.steps[SES.i];const ci=clockInfo();const pct=Math.round(SES.i/Math.max(1,SES.steps.length-1)*100);
  let h=`<div class="topbar"><button class="icon" data-a="quit" aria-label="Quitter la session">✕</button><div class="tb-mid"><div class="tb-label">${blockLabel(st)}</div><div class="prog"><i style="width:${pct}%"></i></div></div><div class="clock ${ci.w?'warn':''}" id="clock">${ci.t}</div></div>`;
  const V={warm:vWarm,card:vCard,prob:vProb,recog:vRecog,concept:vConcept,sprint:vSprint,book:vBook,bilan:vBilan,diag:vDiag,jq:vJQ,blancRes:vBlancRes};
  return h+(V[st.k]||(()=>''))(st);
}

function vWarm(st){
  if(!st.res)st.res={};
  return `<div class="warm"><p class="muted">Réponds vite, de tête. Une virgule pour les décimaux.</p><div class="wq" id="wq">…</div><input id="ans" class="ansin" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><div style="margin-top:14px"><button class="btn primary" style="min-width:200px" data-a="warmOk">Valider</button></div><div class="wfb" id="wfb"></div>${st.start?'':`<button class="btn" style="margin-top:20px" data-a="warmGo">Démarrer</button>`}</div>`;
}
function warmSkills(st){const s=st.all?Object.keys(REF):studiedList().filter(c=>c.skill).map(c=>c.skill);return s.length?s:['mult']}
function warmNext(st){const sk=pick(warmSkills(st));st.cur=Object.assign({skill:sk,t0:Date.now()},REF[sk]());const wq=$('#wq'),inp=$('#ans'),fb=$('#wfb');if(wq)wq.innerHTML=st.cur.q;if(inp){inp.value='';inp.setAttribute('inputmode',st.cur.mode);inp.setAttribute('autocapitalize',st.cur.mode==='text'?'characters':'off');inp.focus()}if(fb){fb.textContent='';fb.className='wfb'}}
function warmSubmit(){const st=SES.steps[SES.i];if(!st.cur||st.busy)return;const inp=$('#ans');const v=inp?inp.value:'';if(!v.trim())return;const ok=norm(v)===norm(st.cur.ans);const ms=Date.now()-st.cur.t0;const r=st.res[st.cur.skill]||(st.res[st.cur.skill]={n:0,ok:0,ms:0});r.n++;if(ok)r.ok++;r.ms+=ms;
  const fb=$('#wfb');if(fb){fb.className='wfb '+(ok?'ok':'ko');fb.textContent=ok?'Juste':'Réponse : '+st.cur.ans}st.busy=true;st.cur=null;
  setTimeout(()=>{st.busy=false;if(Date.now()-st.start>=st.dur*1000)finishWarm();else warmNext(st)},ok?450:1500)}
function finishWarm(){const st=SES.steps[SES.i];if(st.done)return;st.done=true;let n=0,ok=0;for(const [sk,r] of Object.entries(st.res)){n+=r.n;ok+=r.ok;const id='ref:'+sk;if(!S.cards[id])continue;const acc=r.ok/r.n,avg=r.ms/r.n/1000;const g=acc===1&&avg<6?4:acc>=.8?3:acc>=.5?2:1;schedule(id,g,{ms:r.ms/r.n})}save();SES.log.push({k:'warm',n,ok});nextStep()}

function vCard(st){
  const d=DEFS[st.id];if(!d){return `<p>Cette carte n’existe plus.</p><button class="btn" data-a="next">Continuer</button>`}
  if(!st.t0)st.t0=Date.now();
  const cs=S.cards[st.id];let lee=cs&&cs.leech&&d.cid?`<p class="note">Cette carte résiste. Avant de répondre, relis l’exemple résolu. <button class="link" data-a="ovl" data-cid="${d.cid}">Ouvrir la fiche</button></p>`:'';
  let front,back;
  if(d.type==='err'){const e=d.err;front=`<p class="small muted">Erreur du livre, ${SUBS[e.sub]}, ${e.test<=3?'mini-test':'test blanc'} n° ${e.test}, question ${e.q}</p><div class="front">${e.cid?CBYID[e.cid].title:'Question à refaire'}</div><p class="small" style="margin-top:12px">1. Sans regarder, énonce la méthode à voix basse.<br>2. Refais la question ${e.q} dans le livre${bookPage(e.sub,e.test)?` (le test commence p. ${bookPage(e.sub,e.test)})`:''}.</p>`;back=e.cid?`<div class="box" style="text-align:left">${CBYID[e.cid].regle}</div><p style="margin-top:10px"><button class="link" data-a="ovl" data-cid="${e.cid}">Revoir la fiche</button></p>`:'<p>Compare ta résolution avec le corrigé du livre.</p>'}
  else{front=`<p class="small muted">${CBYID[d.cid].title}</p><div class="front">${d.f}</div>`;back=d.b}
  let h=lee+`<div class="card flash">${front}${st.flip?`<div class="back">${back}</div>`:''}</div>`;
  if(!st.flip)h+=`<button class="btn primary block" style="margin-top:16px" data-a="flip">Afficher la réponse</button>`;
  else h+=`<p class="small muted" style="margin-top:14px;text-align:center">Honnêtement, tu t’en souvenais ?</p><div class="grades">${[[1,'À revoir'],[2,'Difficile'],[3,'Correct'],[4,'Facile']].map(([g,l])=>`<button class="btn ${g===1?'g1':''}" data-a="grade" data-g="${g}">${l}<small>${preview(st.id,g)}</small></button>`).join('')}</div>`;
  return h;
}
function vProb(st){
  if(!st.q){st.q=genQ(st.cid);st.phase='ask';st.sel=null;st.t0=Date.now();saveSes()}
  const q=st.q,c=CBYID[st.cid];const cs=S.cards[st.id];
  let left=`<p class="small muted">${SUBS[c.sub]}, ${c.title.toLowerCase()}</p>`;
  if(cs&&cs.leech&&st.phase==='ask')left+=`<p class="note">Ce type de question te résiste. Relis l’exemple résolu avant. <button class="link" data-a="ovl" data-cid="${c.id}">Ouvrir la fiche</button></p>`;
  left+=stemHTML(q)+optsHTML(q,st.sel,st.phase,'pick');
  if(st.phase==='ask'){left+=st.sel==null?`<div class="ask"><button class="btn ghost block" data-a="skipQ">Je ne sais pas</button></div>`:`<div class="ask"><p>Ta confiance ?</p><div class="conf"><button class="btn" data-a="conf" data-c="sure">Sûre</button><button class="btn" data-a="conf" data-c="mid">J’hésite</button><button class="btn" data-a="conf" data-c="guess">Au hasard</button></div></div>`}
  else left+=fbHTML(st,c.id);
  return `<div class="split"><div>${left}</div><div>${scratchHTML('p'+SES.i)}</div></div>`;
}
function fbHTML(st,cid){
  const ok=st.ok;let v=ok?'Juste':st.sel==null?'Passée':'Faux';
  let h=`<div class="fb"><div class="verdict ${ok?'ok':'ko'}">${v}</div>`;
  if(!ok&&st.conf==='sure')h+=`<p class="note">Tu étais sûre de toi : c’est justement le type d’erreur qu’on retient le mieux une fois corrigée. Prends le temps de lire l’explication.</p>`;
  if(ok&&st.conf==='guess')h+=`<p class="note">Bonne réponse, mais au hasard : elle reviendra vite pour vérifier que la méthode est acquise.</p>`;
  h+=`<p>${st.q.ex}</p>`;
  if(st.jid)h+=causeBlock(st.jid);
  if(st.iv)h+=`<p class="small muted">Ce type de question revient dans ${st.iv}.</p>`;
  h+=`<div class="row" style="margin-top:12px"><button class="btn ghost" data-a="ovl" data-cid="${cid}">Revoir la fiche</button><button class="btn primary" data-a="next">Continuer</button></div></div>`;
  return h;
}
function vRecog(st){
  if(!st.q){st.q=recogQ(studiedList('calc').length>=3?studiedList('calc'):CONCEPTS.filter(c=>c.sub==='calc'));st.phase='ask';st.sel=null;st.t0=Date.now();saveSes()}

/* Concept : questions à froid, fiche, quiz */
function vConcept(st){
  const c=CBYID[st.cid];if(!st.phase){st.phase='pre';st.pi=0;st.pre=[genQ(c.id),genQ(c.id)];st.fs={ex:1};st.quiz=[genQ(c.id),genQ(c.id),genQ(c.id),genQ(c.id)];st.qi=0;st.score=0;saveSes()}
  let h=`<h1>${c.title}</h1>`;
  if(st.phase==='pre'){const q=st.pre[st.pi];h+=`<p class="muted">Avant la fiche, ${st.pi===0?'deux questions':'une dernière question'} pour t’échauffer. Pas de note : se tromper maintenant aide à retenir la suite.</p>`;
    h+=`<div class="split"><div>${stemHTML(q)}${optsHTML(q,st.sel,st.sel!=null?'fb':'ask','prePick')}${st.sel!=null?`<div class="fb"><div class="verdict ${st.sel===q.a?'ok':'ko'}">${st.sel===q.a?'Bien joué':'Pas grave'}</div><p class="small">La fiche va t’expliquer la méthode.</p><button class="btn primary block" data-a="preNext">${st.pi===0?'Question suivante':'Ouvrir la fiche'}</button></div>`:''}</div><div>${scratchHTML('pre'+st.pi)}</div></div>`}
  else if(st.phase==='fiche'){h+=ficheHTML(c,st.fs)+`<button class="btn primary block" style="margin-top:26px" data-a="toQuiz">Passer au quiz (4 questions)</button>`}
  else if(st.phase==='quiz'){const q=st.quiz[st.qi];h+=`<p class="muted">Quiz, question ${st.qi+1} sur 4.</p><div class="split"><div>${stemHTML(q)}${optsHTML(q,st.sel,st.sel!=null?'fb':'ask','quizPick')}${st.sel!=null?`<div class="fb"><div class="verdict ${st.sel===q.a?'ok':'ko'}">${st.sel===q.a?'Juste':'Faux'}</div><p>${q.ex}</p>${st.qjid&&st.sel!==q.a?causeBlock(st.qjid):''}<button class="btn primary block" style="margin-top:12px" data-a="quizNext">${st.qi<3?'Question suivante':'Terminer'}</button></div>`:''}</div><div>${scratchHTML('quiz'+st.qi)}</div></div>`}
  else{h+=`<div class="card stack"><p class="verdict ${st.score>=3?'ok':''}">${st.score} bonne${st.score>1?'s':''} réponse${st.score>1?'s':''} sur 4</p><p>${st.score>=3?'Belle entrée en matière.':'C’est normal au premier passage : la répétition fera le travail.'} Ce concept entre dans tes révisions. Ses cartes reviendront dès la prochaine session, puis de plus en plus espacées.</p><button class="btn primary block" data-a="next">Continuer</button></div>`}
  return h;
}

/* Sprint */
function vSprint(st){
  if(!st.qs){const pool=studiedList();st.qs=weightedConcepts(pool.length?pool:CONCEPTS.slice(0,1),st.n).map(c=>({cid:c.id,q:genQ(c.id)}));st.ans=Array(st.n).fill(null);st.ms=Array(st.n).fill(0);st.qi=0;st.phase='intro';st.dur=st.n*80000;saveSes()}
  if(st.phase==='intro')return `<div class="card stack"><h1 style="margin-top:0">Sprint chrono</h1><p>${st.n} questions mêlées en ${Math.round(st.dur/60000)} minutes, soit le rythme du TAGE : 80 secondes par question.</p><p>Barème officiel depuis 2025 : +4 par bonne réponse, 0 sinon. Pas de correction avant la fin.</p><p class="note">Une erreur ne coûte plus rien : ne laisse jamais une question vide. Si tu bloques, élimine ce que tu peux, coche, et passe à la suivante.</p><button class="btn primary block" data-a="sprintGo">Lancer le chrono</button></div>`;
  if(st.phase==='run'){const it=st.qs[st.qi];const sel=st.cursel;return `<div class="split"><div><p class="small muted">Question ${st.qi+1} sur ${st.n}</p>${stemHTML(it.q)}${optsHTML(it.q,sel,'ask','sprintPick')}<div class="row" style="margin-top:16px"><button class="btn primary" data-a="sprintOk" ${sel==null?'disabled':''}>Valider</button></div></div><div>${scratchHTML('sp'+st.qi)}</div></div>`}
  const pts=st.qs.reduce((a,it,i)=>a+(st.ans[i]===it.q.a?4:0),0);const nok=st.qs.filter((it,i)=>st.ans[i]===it.q.a).length;
  let h=`<div class="card"><div class="bigscore"><span class="poster">${pts}</span></div><h1 style="margin-top:0;text-align:center">point${Math.abs(pts)>1?'s':''}</h1><p class="muted">${nok} juste${nok>1?'s':''} sur ${st.n}${st.timeout?', temps écoulé':''}. Rapporté à un sous-test de 15 questions : environ ${Math.round(pts/st.n*15)} / 60.</p></div>`;
  h+=st.qs.map((it,i)=>{const a=st.ans[i];const r=a==null?'sans réponse':a===it.q.a?'juste':'fausse';return `<div class="review-item"><p><b>Question ${i+1}</b> <span class="${a===it.q.a?'ok-t':a==null?'muted':'ko-t'}">${r}</span></p>${stemHTML(it.q)}<p class="small" style="margin-top:8px">Bonne réponse : <b>${L5[it.q.a]}</b>, ${it.q.opts[it.q.a]}.${a!=null&&a!==it.q.a?` Ta réponse : ${L5[a]}.`:''}</p><details><summary>Explication</summary><p>${it.q.ex}</p></details>${it.jid?causeBlock(it.jid):''}</div>`}).join('');
  return h+`<button class="btn primary block" style="margin-top:18px" data-a="next">Continuer</button>`;
}
function finishSprint(timeout){const st=SES.steps[SES.i];if(st.phase!=='run')return;st.phase='review';st.timeout=!!timeout;const now=Date.now();
  const res=st.qs.map((it,i)=>{const a=st.ans[i];const r=a==null?(i>=st.qi&&timeout?'time':'skip'):a===it.q.a?'ok':'ko';if(r==='ko'||r==='skip')it.jid=jAdd({cid:it.cid,sub:CBYID[it.cid].sub,q:jq(it.q),sel:a,cause:r==='skip'?'Manque de temps':null,src:'sprint'});if(r==='ko'&&S.cards[it.cid+':p'])S.cards[it.cid+':p'].due=Math.min(S.cards[it.cid+':p'].due,now);return {cid:it.cid,sub:CBYID[it.cid].sub,r,ms:st.ms[i]||undefined}}).filter(r=>r.r!=='time');
  S.sprints.push({t:now,res});const pts=res.reduce((a,r)=>a+(r.r==='ok'?4:0),0);SES.log.push({k:'sprint',pts,n:st.n,ok:res.filter(r=>r.r==='ok').length});save();saveSes();render();window.scrollTo(0,0)}

/* Test du livre */
function vBook(st){
  const pg=bookPage(st.sub,st.test);const title=st.blanc?`TAGE blanc n° ${st.test}, sous-test ${SUB_ORDER.indexOf(st.sub)+1} sur 6 : ${SUBS[st.sub]}`:`${SUBS[st.sub]}, ${st.test<=3?'mini-test':'test blanc'} n° ${st.test}`;
  if(st.phase==='ready')return `<div class="card stack"><h1 style="margin-top:0">${title}</h1><p>Ouvre le livre${pg?` à la page ${pg}`:''}. 15 questions, 20 minutes, comme le jour J. Tu coches tes réponses ici ; les annonces de temps tombent à 10, 5 et 2 minutes de la fin.</p><p class="note">Le livre date de 2023 et note encore −1 par erreur. Depuis 2025, une erreur vaut 0 : l’app calcule ton score au barème actuel, et tu as intérêt à ne rien laisser vide.</p><button class="btn primary block" data-a="bookGo">Lancer les 20 minutes</button></div>`;
  const sheet=(arr,act,extra)=>`<div class="sheet">${arr.map((v,i)=>`<div class="srow"><span class="n">${i+1}</span><div class="bubs">${[0,1,2,3,4].map(j=>`<button class="sb ${v===j?(act==='bookKey'?'key':'on'):''}" data-a="${act}" data-q="${i}" data-j="${j}" aria-label="Question ${i+1}, ${L5[j]}">${L5[j]}</button>`).join('')}</div>${extra?extra(i):''}</div>`).join('')}</div>`;
  if(st.phase==='run')return `<p class="small muted">${title}. Touche une bulle pour la cocher, touche-la à nouveau pour l’effacer.</p>${sheet(st.ans,'bookAns')}<button class="btn block" style="margin-top:18px" data-a="bookEnd">J’ai terminé</button>`;
  if(st.phase==='key')return `<h1>Le corrigé</h1><p class="muted">Pour chaque question, touche la bonne réponse indiquée dans le corrigé du livre. À droite, ce que tu avais coché.</p>${sheet(st.key,'bookKey',i=>`<span class="mine">${st.ans[i]==null?'–':L5[st.ans[i]]}</span>`)}<button class="btn primary block" style="margin-top:18px" data-a="bookCorrect" ${st.key.every(x=>x!=null)?'':'disabled'}>Calculer mon score</button>`;
  if(st.phase==='errs'){const wrong=st.ans.map((a,i)=>i).filter(i=>st.ans[i]!==st.key[i]);const concepts=CONCEPTS.filter(c=>c.sub===st.sub);

    if(!wrong.length)return h+`<p style="margin-top:16px">Aucune erreur. Superbe.</p><button class="btn primary block" data-a="bookSave">Enregistrer</button>`;
    h+=`<h2>Tes erreurs</h2><p class="muted">Pour chacune, indique la notion en jeu et la cause (le corrigé du livre t’aide). Elles reviendront dans tes révisions.</p>`;
    h+=wrong.map(i=>{const e=st.errs[i]||(st.errs[i]={cid:'',cause:''});return `<div class="erow"><p><b>Question ${i+1}</b> <span class="small muted">${st.ans[i]==null?'passée':'tu as coché '+L5[st.ans[i]]}, réponse ${L5[st.key[i]]}</span></p><select data-ch="errC" data-q="${i}"><option value="">Notion en jeu…</option>${concepts.map(c=>`<option value="${c.id}" ${e.cid===c.id?'selected':''}>${c.title}</option>`).join('')}<option value="autre" ${e.cid==='autre'?'selected':''}>Autre notion</option></select><div class="chips" style="margin-top:10px">${['Méthode inconnue','Erreur de calcul','Piège','Manque de temps'].map(k=>`<button class="chip ${e.cause===k?'on':''}" data-a="errCause" data-q="${i}" data-v="${k}">${k}</button>`).join('')}</div></div>`}).join('');
    return h+`<button class="btn primary block" style="margin-top:18px" data-a="bookSave">Enregistrer dans mes révisions</button>`}
  if(st.blanc){const last=SUB_ORDER.indexOf(st.sub)===5;return `<div class="card stack"><p>${SUBS[st.sub]} : <b>${st.score} / 60</b>. C’est enregistré.</p><button class="btn primary block" data-a="next">${last?'Voir mon score sur 600':'Sous-test suivant'}</button></div>`}
  return `<div class="card stack"><p>C’est enregistré. Tes erreurs reviendront dans tes sessions, à partir de demain.</p><button class="btn primary block" data-a="next">Terminer</button></div>`;
}

/* ============ Programme, positionnement, journal des erreurs, TAGE blanc ============ */
const CAUSES=['Méthode inconnue','Erreur de calcul','Piège','Lecture trop rapide','Manque de temps'];
const DOMAINS=[['Aptitudes verbales',['comp','exp']],['Résolution de problèmes',['calc','cm']],['Raisonnement logique',['raison','logi']]];
function total600(sc){const ds=DOMAINS.map(([,s])=>((sc[s[0]]||0)+(sc[s[1]]||0))/2);return Math.round(ds.reduce((a,b)=>a+b,0)/3*10)}
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dayStart(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
const nextDay=d=>dayStart(d+1.5*DAY);
const mondayOf=t=>{let d=dayStart(t);while(new Date(d).getDay()!==1)d=dayStart(d-0.5*DAY);return d};
function examTime(){return S.plan&&S.plan.exam?new Date(S.plan.exam+'T12:00:00').getTime():null}
function daysLeft(){const e=examTime();return e==null?null:Math.round((dayStart(e)-dayStart())/DAY)}
const fdate=(t,o)=>new Date(t).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'});
const stripT=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();

function effNewPerDay(){
  if(!S.plan||!S.plan.auto)return S.settings.newPerDay;
  const dl=daysLeft();if(dl==null)return S.settings.newPerDay;if(dl<=10)return 0;
  const R=CONCEPTS.filter(c=>!S.studied[c.id]).length;if(!R)return 0;
  return Math.min(4,Math.max(1,Math.ceil(R/Math.max(1,(dl-10)*6/7))));
}
function learnSchedule(){
  const e=examTime();if(!e)return null;const npd=effNewPerDay();let R=CONCEPTS.filter(c=>!S.studied[c.id]).length;
  const perDay={};let d=dayStart();const last=dayStart(e)-10*DAY;let learnEnd=R?null:dayStart();
  if(npd>0)while(R>0&&d<=last){if(new Date(d).getDay()!==6){const n=Math.min(R,npd);perDay[d]=n;R-=n;if(!R)learnEnd=d}d=nextDay(d)}
  return {perDay,learnEnd,left:R};
}
function satOf(t){const d=dayStart(t),wd=new Date(d).getDay();if(wd===6)return d;if(wd===0)return dayStart(d-0.5*DAY);return null}
function weekends(){
  const e=examTime();if(!e)return [];const out=[];let s=satOf(Date.now());
  if(s==null){let d=dayStart();while(new Date(d).getDay()!==6)d=nextDay(d);s=d}
  const B=S.blancs||[];const used=new Set(B.map(b=>b.test));const pool=[];for(let n=4;n<=18;n++)if(!used.has(n))pool.push(n);
  while(s<dayStart(e)-DAY){const key=ymd(s);const done=B.find(b=>b.wk===key);out.push({key,sat:s,test:done?done.test:(pool.shift()||null),done});s=dayStart(s+7.5*DAY)}
  return out;
}
function currentWk(){const s=satOf(Date.now());if(s==null)return null;return weekends().find(w=>w.sat===s)||null}
const drank=id=>{const r=S.diag&&S.diag.res[id];if(!r)return 1;return !r.ok?0:(r.ms<=100000?2:1)};
function upcomingConcepts(n){const st=new Set(Object.keys(S.studied));const out=[];const cnt=sub=>CONCEPTS.filter(c=>c.sub===sub&&st.has(c.id)).length;
  while(out.length<n){const av=CONCEPTS.filter(c=>!st.has(c.id)&&(c.pre||[]).every(p=>st.has(p)));if(!av.length)break;av.sort((a,b)=>drank(a.id)-drank(b.id)||cnt(a.sub)-cnt(b.sub)||CONCEPTS.indexOf(a)-CONCEPTS.indexOf(b));out.push(av[0]);st.add(av[0].id)}return out}

  else h+=`<h2>Positionnement</h2><div class="card stack"><p class="small">Fais le test pour que le programme commence par tes lacunes.</p><button class="btn primary block" data-a="startDiag">Faire le test (environ 20 min)</button></div>`;

  diagOk:()=>diagAdvance(cur().cursel),
  diagSkip:()=>diagAdvance(null),
  diagDone:()=>{SES=null;PENDING=null;saveSes();TAB='plan';render()},
  startBlanc:d=>{const test=+d.n;const steps=SUB_ORDER.map(s=>({k:'book',sub:s,test,phase:'ready',ans:Array(15).fill(null),key:Array(15).fill(null),errs:{},al:{},blanc:true}));steps.push({k:'blancRes',test,wk:d.w});startSes({kind:'blanc',steps,i:0,start:Date.now(),log:[],scores:{}})},
  resetAll:()=>{if(!confirm('Effacer toute la progression ? C’est définitif.'))return;S=blank();buildDefs();save();try{localStorage.removeItem(SKEY)}catch(e){}PENDING=null;render()}
};
function diagAdvance(v){const st=cur();st.ans[st.i]=v;st.ms[st.i]=Date.now()-(st.q0||Date.now());st.cursel=null;st.i++;st.q0=Date.now();UI.scr=false;
  if(st.i>=st.qs.length){const res={};st.qs.forEach((x,i)=>{res[x.cid]={ok:st.ans[i]===x.q.a,skip:st.ans[i]==null,ms:st.ms[i]}});S.diag={t:Date.now(),res};st.phase='res';save()}
  saveSes();render();window.scrollTo(0,0)}
function effNewPerDayAuto(){const p=S.plan;if(!p)return S.settings.newPerDay;const was=p.auto;p.auto=true;const n=effNewPerDay();p.auto=was;return n}
function sprintAdvance(v){const st=cur();if(st.phase!=='run')return;st.ans[st.qi]=v;st.ms[st.qi]=Date.now()-st.qStart;st.cursel=null;st.qi++;st.qStart=Date.now();UI.scr=false;if(st.qi>=st.n)finishSprint(false);else{saveSes();render();window.scrollTo(0,0)}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;if(el.dataset.ch==='bookTest')UI.booktest=el.value;else if(el.dataset.ch==='errC'){const st=cur();const e2=st.errs[el.dataset.q]||(st.errs[el.dataset.q]={cid:'',cause:''});e2.cid=el.value;saveSes()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='ans'){e.preventDefault();warmSubmit()}});
setInterval(()=>{if(!SES)return;const st=cur();if(!st)return;const c=$('#clock');if(c){const ci=clockInfo();c.textContent=ci.t;c.classList.toggle('warn',ci.w)}
  if(st.k==='sprint'&&st.phase==='run'&&Date.now()-st.start>=st.dur)finishSprint(true);
  if(st.k==='book'&&st.phase==='run'){const rem=(st.dur-(Date.now()-st.start))/1000;for(const th of [600,300,120]){if(rem<=th&&rem>th-30&&!st.al[th]){st.al[th]=1;toast(`Il reste ${th/60} minutes`);saveSes()}}if(rem<=0){st.phase='key';toast('Temps écoulé');saveSes();render()}}
  if(st.k==='warm'&&st.start&&!st.done&&!st.busy&&Date.now()-st.start>=st.dur*1000)finishWarm();
},500);
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if($('#scr'))initScratch()},200)});
applyTheme();render();initSync();
</script>
</body>
</html>
