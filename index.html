<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TAGE Maths">
<meta name="theme-color" content="#FFFFFF">
<title>TAGE MAGE, maths et logique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Bowlby+One&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#FFFFFF;--card:#FFFFFF;--ink:#111111;--muted:#5C5E55;--hair:#D8DCC8;--grid:#E4E8D5;
  --sage:#E8ECD6;--sage-2:#D4DBB9;--aub:#2E1B3B;--stroke:#111111;--on-sage:#111111;
  --green:#2F6B3F;--green-soft:#DDEBD2;--red:#B3362B;--red-soft:#F7E1DC;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --serif:'Instrument Serif','Times New Roman',Georgia,serif;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212;--card:#1A1A18;--ink:#E8ECD6;--muted:#A5A895;--hair:#34362E;--grid:#2A2C25;
    --aub:#CDB8E0;--green:#86C795;--green-soft:#1D3322;--red:#F08A7E;--red-soft:#3A1F1B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212;--card:#1A1A18;--ink:#E8ECD6;--muted:#A5A895;--hair:#34362E;--grid:#2A2C25;
  --aub:#CDB8E0;--green:#86C795;--green-soft:#1D3322;--red:#F08A7E;--red-soft:#3A1F1B;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--aub);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:14px 18px calc(104px + env(safe-area-inset-bottom,0px))}
body.ses #app{max-width:1180px;padding-bottom:40px}
body.ses #tabs{display:none}

/* typographie de l'affiche */
.poster{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--sage);-webkit-text-stroke:2.2px var(--stroke);paint-order:stroke fill;letter-spacing:.01em;line-height:.98}
.lineup{text-align:center;margin:18px 0 8px}
.lineup .kick{font-family:var(--serif);color:var(--aub);font-size:clamp(34px,9vw,64px);line-height:.9;margin:0 0 10px;text-transform:uppercase}
.lineup .poster{display:block;font-size:clamp(40px,12.5vw,104px)}
.lineup .poster.s{font-size:clamp(28px,8.6vw,72px)}
.tag{font:900 13px/1 var(--sans);letter-spacing:-.01em;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:400;color:var(--aub);font-size:40px;line-height:1.02;margin:10px 0 8px}
h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;margin:36px 0 12px}
h3{font:800 17px/1.3 var(--sans);margin:22px 0 8px}
p{margin:0 0 10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;padding:4px 0 2px}
.brand .tag:last-child{color:var(--muted);font-weight:700;text-transform:none;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:14.5px;line-height:1.45}
.mono{font-family:var(--sans);font-weight:800;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px}
.card.flat{background:transparent}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:800 16.5px/1.2 var(--sans);cursor:pointer;text-align:center}
.btn.primary{background:var(--sage);color:var(--on-sage);border-color:var(--stroke)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;border-color:var(--hair)}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.link{border:0;background:none;color:var(--ink);font-weight:800;padding:6px 0;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-weight:800;font-size:15px;cursor:pointer}
.chip.on{background:var(--sage);color:var(--on-sage);border-color:var(--stroke)}
hr{border:0;border-top:2px solid var(--ink);margin:22px 0}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--ink);display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;max-width:170px;min-height:48px;border:2px solid transparent;background:none;color:var(--muted);font-weight:800;font-size:15px;border-radius:999px;cursor:pointer}
#tabs button.on{color:var(--on-sage);background:var(--sage);border-color:var(--stroke)}

/* accueil */
.hero{padding:22px}
.hero h1{margin-top:0}
.plan{list-style:none;padding:0;margin:16px 0 18px;counter-reset:p}
.plan li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1.5px solid var(--hair)}
.plan li:first-child{border-top:0}
.plan li::before{counter-increment:p;content:counter(p);font:900 15px var(--sans);min-width:18px}
.plan .dur{margin-left:auto;color:var(--muted);font-size:14.5px;white-space:nowrap}
.resume{background:var(--sage);color:var(--on-sage);border-color:var(--stroke)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border:2px solid var(--ink);border-radius:18px;padding:12px 14px;background:var(--card)}
.kpi b{display:block;font:900 26px/1.15 var(--sans);font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;background:var(--sage);border:2px solid var(--stroke);border-radius:8px 8px 3px 3px;min-height:6px}
.bars div:first-child i{background:var(--aub);border-color:var(--aub)}
.bars em{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:700}
.bars strong{font:800 13px var(--sans)}

.cases{display:inline-flex;gap:3px;vertical-align:middle}
.cases i{width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;opacity:.35}
.cases i.f{background:var(--sage);border-color:var(--stroke);opacity:1}
.clist{list-style:none;margin:0;padding:0}
.clist li+li{border-top:1.5px solid var(--hair)}
.crow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;background:none;border:0;text-align:left;cursor:pointer;min-height:62px}
.crow .t{flex:1}
.crow .t b{display:block;font-size:16.5px;font-weight:800}
.crow .t span{font-size:14px;color:var(--muted)}
.bloc{font:900 13px var(--sans);text-transform:uppercase;color:var(--aub);margin:18px 0 2px}
.subhead{text-align:center;margin:40px 0 14px}
.subhead .poster{font-size:clamp(34px,9.5vw,66px)}

/* fiche */
.fsec{margin-top:28px}
.fsec h3{margin:0 0 8px}
.box{background:var(--sage);color:var(--on-sage);border:2px solid var(--stroke);padding:14px 18px;border-radius:18px}
.box ul,.box ol{margin:0;padding-left:20px}
.box li+li{margin-top:6px}
.box.alt{background:var(--card);color:var(--ink);border:2px dashed var(--ink)}
.pit{margin:0;padding-left:0;list-style:none}
.pit li{padding:11px 15px;border-radius:14px;background:var(--red-soft);margin-top:8px}
.wsteps{margin:10px 0 12px;padding-left:26px}
.wsteps li{padding:4px 0}
.wsteps li::marker{font-weight:900;color:var(--aub)}
.blank{border:2px dashed var(--ink);border-radius:16px;padding:10px 12px;margin:6px 0}
.cmtable{width:100%;border-collapse:collapse;margin-top:4px}
.cmtable td{padding:7px 4px;vertical-align:top;border-top:1.5px solid var(--stroke)}
.cmtable tr:first-child td{border-top:0}
.cmtable td:first-child{font-family:var(--display);width:36px;font-size:18px}

/* questions */
.stem{font-size:19.5px;line-height:1.5;font-weight:500}
.series{font:800 25px/1.3 var(--sans);font-variant-numeric:tabular-nums;margin:12px 0 4px;letter-spacing:.02em;overflow-x:auto}
.infos{margin-top:12px}
.infos p{padding:10px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);margin-bottom:8px}
.gridq{display:inline-grid;grid-template-columns:repeat(3,60px);gap:6px;margin:12px 0 4px}
.gridq span{height:56px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--card);font:900 21px var(--sans)}
.gridq span.q{background:var(--sage);color:var(--on-sage);border-style:dashed}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 14px;text-align:left;border:2px solid var(--hair);border-radius:18px;background:var(--card);font-size:17px;line-height:1.35;cursor:pointer}
.opt:disabled{cursor:default}
.bub{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--stroke);background:var(--sage);color:var(--on-sage);display:grid;place-items:center;font-family:var(--display);font-size:15px}
.opt.sel{border-color:var(--ink)}
.opt.sel .bub{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.good{border-color:var(--green);background:var(--green-soft)}
.opt.good .bub{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .bub{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.5}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.conf .btn{padding:0 8px}
.ask{margin-top:18px}
.ask p{margin-bottom:6px;font-weight:800}
.fb{margin-top:18px;padding:16px 18px;border-radius:20px;background:var(--card);border:2px solid var(--ink)}
.verdict{font-family:var(--display);text-transform:uppercase;font-size:24px;margin-bottom:6px}
.verdict.ok{color:var(--green)}
.verdict.ko{color:var(--red)}
.note{font-size:15px;padding:10px 14px;border-radius:14px;background:var(--sage);color:var(--on-sage);border:2px solid var(--stroke);margin:10px 0}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades .btn{flex-direction:column;gap:2px;min-height:66px;padding:6px 4px;font-size:15px;border-radius:18px}
.grades small{font-weight:500;color:var(--muted);font-size:13px}
.grades .g1{border-color:var(--red);color:var(--red)}
.flash{text-align:center;padding:30px 20px}
.flash .front{font:800 22px/1.35 var(--sans)}
.flash .back{font-size:19px;line-height:1.5;margin-top:18px;padding-top:18px;border-top:2px dashed var(--ink)}
.bigscore{text-align:center;margin:6px 0 12px}
.bigscore .poster{font-size:clamp(64px,20vw,140px)}

/* session */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;padding:10px 0 12px;background:var(--bg)}
.icon{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:18px;font-weight:800;cursor:pointer;flex:none}
.tb-mid{flex:1;min-width:0}
.tb-label{font:900 14px var(--sans);text-transform:uppercase;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.prog i{display:block;height:100%;background:var(--sage)}
.clock{font:900 19px var(--sans);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.clock.warn{color:var(--red)}
.split{display:grid;gap:18px}
.scr-toggle{margin-top:14px}
.scr-wrap{display:none;margin-top:14px}
.scr-wrap.open{display:block}
.scr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.scr-wrap canvas{display:block;width:100%;height:320px;border:2px solid var(--ink);border-radius:20px;touch-action:none;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px;cursor:crosshair}
@media (min-width:900px){
  .split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start;gap:28px}
  .scr-toggle{display:none}
  .scr-wrap{display:block;margin-top:0;position:sticky;top:80px}
  .scr-wrap canvas{height:min(72vh,660px)}
}
.alertbar{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--sage);color:var(--on-sage);border:2px solid var(--stroke);padding:12px 22px;border-radius:999px;font-weight:800;white-space:nowrap}
.warm{text-align:center;padding-top:10px}
.warm .wq{font:900 44px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin:26px 0 18px;min-height:52px}
.ansin{width:100%;max-width:340px;min-height:64px;text-align:center;font:900 30px var(--sans);border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);padding:0 16px}
.ansin:focus{background:var(--sage);color:var(--on-sage);outline:none}
.wfb{min-height:30px;margin-top:12px;font-weight:800;font-size:18px}
.wfb.ok{color:var(--green)}.wfb.ko{color:var(--red)}
.sheet{display:grid;gap:6px}
.srow{display:flex;align-items:center;gap:8px}
.srow .n{width:30px;font:900 15px var(--sans);color:var(--muted);text-align:right}
.srow .bubs{display:flex;gap:6px}
.sb{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-family:var(--display);font-size:14px;cursor:pointer;display:grid;place-items:center}
.sb.on{background:var(--sage);color:var(--on-sage);border-color:var(--stroke)}
.sb.key{background:var(--green);border-color:var(--green);color:#fff}
.srow .mine{font:900 14px var(--sans);color:var(--muted);min-width:40px}
.erow{padding:14px 0;border-top:1.5px solid var(--hair)}
select{font:inherit;font-size:16px;min-height:48px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:0 12px;max-width:100%}
textarea{width:100%;min-height:110px;font:14px/1.4 ui-monospace,Menlo,monospace;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px}
#ovl{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
#ovl .inner{max-width:760px;margin:0 auto}
#ovl[hidden]{display:none}
.meter{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:8px;background:var(--card)}
.meter i{display:block;height:100%;background:var(--sage)}
.srow2{padding:14px 0;border-top:1.5px solid var(--hair)}
.srow2:first-child{border-top:0}
.srow2 .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.srow2 .top b{font-weight:800}
.review-item{padding:14px 0;border-top:1.5px solid var(--hair)}
details summary{cursor:pointer;font-weight:800;padding:6px 0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ok-t{color:var(--green);font-weight:800}.ko-t{color:var(--red);font-weight:800}
.syncline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.syncline i{width:12px;height:12px;border-radius:50%;border:2px solid var(--stroke);background:var(--sage);flex:none}
.syncline.off i{background:transparent;border-color:var(--muted)}
@media (max-width:420px){
  h1{font-size:34px}
  .grades .btn{font-size:14px}
  .kpi b{font-size:22px}
  .sb{width:39px;height:39px}
  .poster{-webkit-text-stroke-width:1.8px}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.chip{transition:background-color .15s,border-color .15s}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Navigation"></nav>
<div id="ovl" hidden></div>
<script>
'use strict';
/* ============ Outils ============ */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function fr(n,d=2){const p=Math.pow(10,d);const r=Math.round(n*p)/p;const s=Math.abs(r).toString();if(s.includes('e'))return String(r);let [i,dec]=s.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');return (r<0?'−':'')+i+(dec?','+dec:'')}
const eur=n=>fr(n)+' €';
const pctS=x=>(x>0?'+':x<0?'−':'')+fr(Math.abs(x))+' %';
function fmtH(h){const m=Math.round(h*60);const H=Math.floor(m/60),M=m%60;if(!H)return M+' min';return H+' h'+(M?' '+String(M).padStart(2,'0'):'')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET=n=>String.fromCharCode(65+((((n-1)%26)+26)%26));
const L5='ABCDE';
function numOpts(ans,cands,fmt=fr){
  const A=fmt(ans);const seen=new Set([A]);const d=[];
  const okv=c=>typeof c==='number'&&isFinite(c)&&(c>0||ans<=0||fmt===pctS);
  for(const c of cands){if(!okv(c))continue;const s=fmt(c);if(!seen.has(s)){seen.add(s);d.push(s)}if(d.length===4)break}
  const step=Math.max(1,Math.round(Math.abs(ans)*0.1));let k=1;
  while(d.length<4&&k<80){const c=ans+(k%2?1:-1)*Math.ceil(k/2)*step;if(okv(c)){const s=fmt(c);if(!seen.has(s)){seen.add(s);d.push(s)}}k++}
  const opts=shuffle([A,...d]);return {opts,a:opts.indexOf(A)};
}
function strOpts(ans,cands){const seen=new Set([ans]);const d=[];for(const c of cands){if(c!=null&&!seen.has(c)){seen.add(c);d.push(c)}if(d.length===4)break}const opts=shuffle([ans,...d]);return {opts,a:opts.indexOf(ans)}}

const SUBS={calc:'Calcul',cm:'Conditions minimales',logi:'Logique'};
const SUB_ORDER=['calc','cm','logi'];
const CM_OPTS=['L’information (1) suffit, la (2) non','L’information (2) suffit, la (1) non','Les deux ensemble suffisent, aucune seule','Chacune suffit seule','Même ensemble, elles ne suffisent pas'];
const LEVELS=['Nouveau','Découvert','En apprentissage','Consolidé','Maîtrisé'];

/* ============ Le cours ============ */
const CONCEPTS=[
{id:'calc-mental',sub:'calc',bloc:'Outils de calcul',title:'Calcul mental et astuces',book:'fiches 22, 23 et 28 (p. 100 à 113)',skill:'mult',
intuition:`Au TAGE, la calculatrice est interdite et chaque question doit prendre environ 80 secondes. Le calcul mental ne consiste pas à calculer plus vite, mais à <b>transformer</b> une opération pénible en opérations faciles : multiplier par 10 ou par 100, diviser par 2 ou par 4, ajouter ou retrancher un petit nombre.`,
regle:`<ul><li><b>× 5</b> : × 10, puis ÷ 2</li><li><b>× 25</b> : × 100, puis ÷ 4</li><li><b>× 9</b> : × 10, moins le nombre. <b>× 99</b> : × 100, moins le nombre</li><li><b>× 11</b> d’un nombre ab : on écrit a, puis a + b, puis b (retenue si a + b ≥ 10)</li><li><b>Carré d’un nombre qui finit par 5</b> : n × (n + 1), puis on écrit 25</li></ul>`,
ex:{enonce:'Calculer 48 × 25 de tête.',steps:['25, c’est 100 ÷ 4 : on remplace × 25 par × 100 puis ÷ 4.','48 × 100 = 4 800.','4 800 ÷ 4 = 1 200. Réponse : 1 200.']},
trou:{enonce:'Calculer 65².',steps:['Le nombre finit par 5 : on prend n = 6.','n × (n + 1) = 6 × 7 = 42.','On accole 25 : 65² = 4 225.'],blank:1,choices:['6 × 7 = 42','6 × 6 = 36','6 × 5 = 30'],ok:0},
pieges:['× 11 avec retenue : 78 × 11 donne 7, puis 15, puis 8. Le 1 de 15 s’ajoute au 7 : 858, et non 7 158.','Poser toute l’opération alors que les 5 réponses ont des derniers chiffres différents : le dernier chiffre suffit à trancher.'],
reflexe:'Avant de calculer, regarde les réponses. L’ordre de grandeur et le dernier chiffre éliminent souvent 3 ou 4 propositions en quelques secondes.',
cartes:[['Multiplier par 25 de tête ?','× 100, puis ÷ 4. Exemple : 36 × 25 = 3 600 ÷ 4 = 900.'],['Multiplier par 11 un nombre à deux chiffres ab ?','On écrit a, puis a + b, puis b (avec retenue). Exemple : 53 × 11 = 583.'],['Carré d’un nombre qui finit par 5 ?','n × (n + 1), puis on accole 25. Exemple : 35² : 3 × 4 = 12, donc 1 225.'],['Multiplier par 99 ?','× 100, puis on retire le nombre. Exemple : 47 × 99 = 4 700 − 47 = 4 653.']]},

{id:'calc-fractions',sub:'calc',bloc:'Outils de calcul',title:'Fractions et décimaux',book:'fiches 25, 26 et 44 (p. 106 à 109 et p. 144)',skill:'frac',
intuition:`Une fraction est une division en attente. Connaître par cœur les équivalences entre fractions et décimaux permet de choisir la forme la plus simple : 0,375 × 64 est pénible, 3/8 × 64 se fait de tête. Et diviser par un nombre plus petit que 1 <b>agrandit</b> le résultat.`,
regle:`<ul><li>1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75 ; 1/5 = 0,2</li><li>1/8 = 0,125, donc 3/8 = 0,375 ; 5/8 = 0,625 ; 7/8 = 0,875</li><li>1/3 ≈ 0,333 ; 2/3 ≈ 0,667 ; 1/6 ≈ 0,167 ; 1/9 ≈ 0,111</li><li>Diviser par une fraction, c’est multiplier par son inverse : ÷ 0,25 = × 4 ; ÷ 0,125 = × 8 ; ÷ 0,75 = × 4/3</li><li>Pour additionner, on met d’abord au même dénominateur : 1/2 + 1/3 = 3/6 + 2/6 = 5/6</li></ul>`,
ex:{enonce:'Calculer 36 ÷ 0,75.',steps:['0,75 = 3/4.','Diviser par 3/4, c’est multiplier par 4/3.','36 ÷ 3 = 12, puis 12 × 4 = 48. Réponse : 48.']},
trou:{enonce:'Calculer 0,375 × 64.',steps:['0,375 = 3/8.','64 ÷ 8 = 8.','8 × 3 = 24. Réponse : 24.'],blank:0,choices:['0,375 = 3/8','0,375 = 3/5','0,375 = 1/3'],ok:0},
pieges:['1/2 + 1/3 ne fait pas 2/5 : on n’additionne jamais les dénominateurs.','Diviser par 0,5 double le nombre (il ne le divise pas par deux).'],
reflexe:'Dès que tu vois 0,125, 0,25, 0,2, 0,75 ou 0,375, passe en fraction : le calcul se simplifie presque toujours.',
cartes:[['3/8 en décimal ?','0,375 (1/8 = 0,125, et 3 × 0,125 = 0,375).'],['1/6 en décimal ?','Environ 0,167 (la moitié de 1/3 ≈ 0,333).'],['Diviser par 0,25 revient à… ?','Multiplier par 4.'],['a/b ÷ c/d = ?','a/b × d/c : on multiplie par l’inverse.']]},

{id:'calc-pct',sub:'calc',bloc:'Proportions',title:'Pourcentages et évolutions',book:'fiches 34 et 35 (p. 124 à 127)',skill:'pct',pre:['calc-fractions'],
intuition:`Un pourcentage d’évolution est un <b>coefficient multiplicateur</b>. Augmenter de 20 %, c’est multiplier par 1,2 ; baisser de 20 %, c’est multiplier par 0,8. Tout découle de là : les évolutions successives se multiplient (elles ne s’additionnent pas), et pour revenir en arrière, on divise.`,
regle:`<ul><li>Hausse de t % : × (1 + t/100). Baisse de t % : × (1 − t/100)</li><li>Évolutions successives : on multiplie les coefficients</li><li>Valeur avant une hausse de t % : on divise par (1 + t/100)</li><li>Taux d’évolution de A vers B : (B − A) ÷ A × 100, toujours par rapport à la valeur de départ</li><li>+a % puis −a % : baisse de a²/100 % (±10 % donne −1 %)</li></ul>`,
ex:{enonce:'Un prix augmente de 25 %, puis baisse de 20 %. Quelle est l’évolution globale ?',steps:['Coefficients : +25 % donne × 1,25 ; −20 % donne × 0,8.','On multiplie : 1,25 × 0,8 = 1.','Coefficient 1 : le prix n’a pas bougé. Évolution : 0 %.']},
trou:{enonce:'Après une hausse de 20 %, un article coûte 96 €. Quel était son prix ?',steps:['La hausse correspond au coefficient 1,2.','Prix initial = 96 ÷ 1,2.','Prix initial = 80 €.'],blank:1,choices:['Prix initial = 96 ÷ 1,2.','Prix initial = 96 × 0,8.','Prix initial = 96 − 20.'],ok:0},
pieges:['Baisser de 20 % un prix qui a augmenté de 20 % ne ramène pas au départ : 1,2 × 0,8 = 0,96, soit −4 %.','Pour retrouver un prix initial, on divise par le coefficient. Retirer 20 % au prix final donne un résultat faux.','Un taux d’évolution se calcule par rapport à la valeur de départ, jamais d’arrivée.'],
reflexe:'10 % : on décale la virgule. 5 % : la moitié de 10 %. 15 % : 10 % + 5 %. 25 % : un quart.',
cartes:[['Hausse de t % en coefficient ?','× (1 + t/100). Exemple : +15 % donne × 1,15.'],['+a % puis −a % ?','Une baisse de a²/100 %. Exemple : +20 % puis −20 % donne −4 %.'],['Retrouver la valeur avant une hausse de t % ?','Diviser par (1 + t/100).'],['Taux d’évolution de A à B ?','(B − A) ÷ A × 100.']]},

{id:'calc-prop',sub:'calc',bloc:'Proportions',title:'Proportionnalité',book:'fiches 36 et 37 (p. 128 à 131)',
intuition:`Deux grandeurs sont proportionnelles quand doubler l’une double l’autre : le prix et le nombre d’articles, par exemple. Elles sont <b>inversement</b> proportionnelles quand doubler l’une divise l’autre par deux : plus d’ouvriers, moins de jours. La première question à se poser est toujours : « si je double, que se passe-t-il ? »`,
regle:`<ul><li>Direct : passer par l’unité (le prix d’un article), ou produit en croix : a/b = c/x donne x = b × c ÷ a</li><li>Inverse : le produit reste constant (ouvriers × jours = quantité de travail)</li><li>Multiple : la production est proportionnelle à chaque facteur (machines × heures). On ajuste les facteurs un par un</li></ul>`,
ex:{enonce:'6 stylos coûtent 9 €. Combien coûtent 10 stylos ?',steps:['Prix d’un stylo : 9 ÷ 6 = 1,50 €.','10 stylos : 10 × 1,50 = 15 €.']},
trou:{enonce:'4 ouvriers font un chantier en 15 jours. Combien de jours faut-il à 6 ouvriers ?',steps:['Quantité de travail : 4 × 15 = 60 jours-ouvrier.','Avec 6 ouvriers : 60 ÷ 6 = 10 jours.'],blank:0,choices:['Quantité de travail : 4 × 15 = 60 jours-ouvrier.','Chaque ouvrier : 15 ÷ 4 = 3,75 jours.','Règle de trois : 15 × 6 ÷ 4 = 22,5 jours.'],ok:0},
pieges:['Appliquer une règle de trois directe à une situation inverse : plus d’ouvriers ne veut pas dire plus de jours.','En proportionnalité multiple, oublier l’un des facteurs (le nombre d’heures, par exemple).'],
reflexe:'Vérifie le sens : si une réponse va dans la mauvaise direction (plus d’ouvriers et plus de jours), elle est fausse sans calcul.',
cartes:[['Produit en croix : a/b = c/x. Que vaut x ?','x = b × c ÷ a.'],['Grandeurs inversement proportionnelles ?','Leur produit reste constant (exemple : ouvriers × jours).'],['Proportionnalité multiple (machines, heures, pièces) ?','Les pièces sont proportionnelles à machines × heures : on multiplie par le rapport de chaque facteur.']]},

{id:'calc-moy',sub:'calc',bloc:'Proportions',title:'Moyennes',book:'fiches 38 et 39 (p. 132 à 135)',
intuition:`Une moyenne, c’est un total réparti équitablement. Presque tous les problèmes se résolvent en repassant par le <b>total</b> : total = moyenne × effectif. Et quand deux groupes n’ont pas la même taille, la moyenne globale penche vers le groupe le plus nombreux.`,
regle:`<ul><li>Total = moyenne × effectif</li><li>Moyenne pondérée : (somme des valeurs × coefficients) ÷ (somme des coefficients)</li><li>Ajouter ou retirer un élément : on recalcule le total, puis on divise par le nouvel effectif</li></ul>`,
ex:{enonce:'La moyenne de 4 notes est 12. Quelle 5e note faut-il pour avoir 13 de moyenne ?',steps:['Total actuel : 4 × 12 = 48.','Total visé : 5 × 13 = 65.','Note nécessaire : 65 − 48 = 17.']},
trou:{enonce:'Groupe A : 10 personnes, moyenne 20. Groupe B : 30 personnes, moyenne 12. Quelle est la moyenne de l’ensemble ?',steps:['Total : 10 × 20 + 30 × 12 = 200 + 360 = 560.','Effectif : 40. Moyenne : 560 ÷ 40 = 14.'],blank:0,choices:['Total : 10 × 20 + 30 × 12 = 200 + 360 = 560.','Moyenne des moyennes : (20 + 12) ÷ 2 = 16.','Produit : 20 × 12 = 240.'],ok:0},
pieges:['Faire la moyenne des moyennes quand les effectifs sont différents.','Confondre la moyenne des vitesses et la vitesse moyenne (voir le concept Vitesse).'],
reflexe:'La moyenne pondérée est toujours plus proche du groupe le plus nombreux. Dans l’exemple, elle est forcément plus près de 12 que de 20 : tout ce qui dépasse 16 est éliminé d’office.',
cartes:[['Total d’une série de moyenne m et d’effectif n ?','m × n.'],['Moyenne de deux groupes de tailles différentes ?','Total des deux groupes ÷ effectif total (moyenne pondérée).'],['Note à obtenir pour atteindre une moyenne visée ?','Moyenne visée × nouvel effectif, moins le total actuel.']]},

{id:'calc-vitesse',sub:'calc',bloc:'Problèmes types',title:'Vitesse, distance, temps',book:'fiches 45, 47, 48 et 49 (p. 146 à 155)',pre:['calc-prop'],
intuition:`Tout tient en une formule : distance = vitesse × temps. Les difficultés viennent presque toujours des <b>unités de temps</b> (1 h 15 vaut 1,25 h, pas 1,15 h) et de deux situations types : deux mobiles qui se rapprochent (on additionne leurs vitesses) ou qui se poursuivent (on les soustrait).`,
regle:`<ul><li>d = v × t ; v = d ÷ t ; t = d ÷ v</li><li>Minutes en heures : ÷ 60 (15 min = 0,25 h ; 45 min = 0,75 h ; 12 min = 0,2 h)</li><li>Croisement (face à face) : temps = distance ÷ (v₁ + v₂)</li><li>Rattrapage (même sens) : temps = écart ÷ (v₁ − v₂)</li><li>Vitesse moyenne d’un aller-retour : 2 × v₁ × v₂ ÷ (v₁ + v₂), et non la moyenne des deux vitesses</li></ul>`,
ex:{enonce:'Aller à 60 km/h, retour sur le même trajet à 40 km/h. Quelle est la vitesse moyenne ?',steps:['On prend un trajet de 120 km (un multiple commode de 60 et de 40).','Aller : 120 ÷ 60 = 2 h. Retour : 120 ÷ 40 = 3 h.','Total : 240 km en 5 h, soit 48 km/h (et non 50).']},
trou:{enonce:'Deux voitures distantes de 300 km roulent l’une vers l’autre, à 70 et 80 km/h. Quand se croisent-elles ?',steps:['Elles se rapprochent de 70 + 80 = 150 km chaque heure.','Temps : 300 ÷ 150 = 2 h.'],blank:0,choices:['Elles se rapprochent de 70 + 80 = 150 km chaque heure.','Elles se rapprochent de 80 − 70 = 10 km chaque heure.','Elles se rapprochent de (70 + 80) ÷ 2 = 75 km chaque heure.'],ok:0},
pieges:['1 h 15 = 1,25 h, pas 1,15 h. Même piège avec 1 h 30 = 1,5 h.','La vitesse moyenne d’un aller-retour n’est pas la moyenne des deux vitesses : elle est plus proche de la vitesse la plus lente.'],
reflexe:'60 km/h, c’est 1 km par minute. Ramène les vitesses à cette référence pour calculer de tête.',
cartes:[['Vitesse moyenne d’un aller-retour à v₁ puis v₂ ?','2 × v₁ × v₂ ÷ (v₁ + v₂).'],['Deux mobiles face à face : temps avant le croisement ?','Distance ÷ (v₁ + v₂).'],['Rattrapage : temps ?','Écart ÷ (v₁ − v₂).'],['45 min en heures ?','0,75 h.'],['Passer des km/h aux m/s ?','Diviser par 3,6.']]},

{id:'calc-travail',sub:'calc',bloc:'Problèmes types',title:'Travail en commun et débits',book:'fiches 40 et 46 (p. 136 et p. 148)',pre:['calc-fractions'],
intuition:`On n’additionne jamais des durées : on additionne des <b>vitesses de travail</b>. Si A fait le travail en 3 h, il en fait 1/3 par heure ; si B le fait en 6 h, il en fait 1/6 par heure. Ensemble : 1/3 + 1/6 = 1/2 par heure, donc 2 h.`,
regle:`<ul><li>1/T = 1/t₁ + 1/t₂</li><li>Pour deux : T = t₁ × t₂ ÷ (t₁ + t₂)</li><li>Remplissage et fuite : 1/T = 1/t(remplissage) − 1/t(fuite)</li><li>Le temps à deux est toujours plus court que celui du plus rapide seul</li></ul>`,
ex:{enonce:'Un robinet remplit une cuve en 3 h, un autre en 6 h. En combien de temps la remplissent-ils ensemble ?',steps:['Par heure : 1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2 de cuve.','La moitié par heure : 2 h pour la cuve entière.','Vérification : 3 × 6 ÷ (3 + 6) = 18 ÷ 9 = 2 h.']},
trou:{enonce:'Ensemble, A et B font un travail en 4 h. Seul, A met 12 h. Combien de temps met B seul ?',steps:['Part de B par heure : 1/4 − 1/12.','1/4 − 1/12 = 3/12 − 1/12 = 2/12 = 1/6.','B seul : 6 h.'],blank:0,choices:['Part de B par heure : 1/4 − 1/12.','Durée de B : 12 − 4 = 8 h.','Part de B par heure : 1/4 + 1/12.'],ok:0},
pieges:['Additionner les durées (3 h + 6 h = 9 h) : absurde, à deux on va plus vite.','Faire la moyenne des durées.'],
reflexe:'Élimine toute réponse supérieure au temps du plus rapide seul : elle ne peut pas être juste.',
cartes:[['Deux personnes en t₁ et t₂ : temps ensemble ?','t₁ × t₂ ÷ (t₁ + t₂).'],['Remplissage en t₁, fuite en t₂ ?','1/T = 1/t₁ − 1/t₂.'],['Le temps à deux peut-il dépasser celui du plus rapide ?','Non, il est toujours plus court.']]},

{id:'calc-eq',sub:'calc',bloc:'Algèbre',title:'Équations et systèmes',book:'fiches 42, 43 et 66 (p. 140 à 143 et p. 188)',
intuition:`Un problème rédigé se traduit en équations : une inconnue par quantité cherchée, une équation par information. Avec deux inconnues, il faut deux équations. Mais au TAGE, il existe souvent plus rapide : <b>tester les réponses proposées</b> (le backsolving).`,
regle:`<ul><li>Traduire mot à mot : « A a 5 ans de plus que B » donne A = B + 5</li><li>Système : additionner ou soustraire les équations pour faire disparaître une inconnue</li><li>Backsolving : tester la réponse du milieu (C). Si elle est trop grande, descendre ; sinon, monter</li></ul>`,
ex:{enonce:'Un père a 3 fois l’âge de sa fille. Dans 12 ans, il aura le double de son âge. Quel âge a le père ?',steps:['Fille : f. Père : 3f.','Dans 12 ans : 3f + 12 = 2 × (f + 12).','3f + 12 = 2f + 24, donc f = 12. Le père a 36 ans.']},
trou:{enonce:'2x + y = 11 et x − y = 1. Que vaut x ?',steps:['On additionne les deux équations : les y disparaissent.','3x = 12.','x = 4 (et y = 3).'],blank:0,choices:['On additionne les deux équations : les y disparaissent.','On multiplie les deux équations entre elles.','On soustrait la deuxième de la première : les x disparaissent.'],ok:0},
pieges:['Traduire à l’envers : « A a 3 ans de moins que B » donne A = B − 3.','Donner la valeur de x quand l’énoncé demande y (ou l’âge de la fille au lieu de celui du père).'],
reflexe:'Si l’énoncé est long mais que les réponses sont des nombres simples, teste-les : c’est souvent deux fois plus rapide que de poser l’équation.',
cartes:[['Le backsolving ?','Tester les réponses proposées, en commençant par celle du milieu.'],['« A a 3 ans de moins que le double de B » ?','A = 2B − 3.'],['Système à deux inconnues : combien d’équations faut-il ?','Deux équations indépendantes (qui ne disent pas la même chose).']]},

{id:'cm-grille',sub:'cm',bloc:'Méthode',title:'La grille A à E',book:'fiches 98 à 107 (p. 328 à 347)',
intuition:`En Conditions minimales, on ne cherche pas la réponse : on cherche seulement à savoir si les informations <b>permettent</b> de la trouver. On teste l’information (1) seule, puis la (2) seule, puis les deux ensemble. Inutile de finir les calculs : dès qu’on sait qu’on peut, on s’arrête.`,
regle:`<table class="cmtable"><tr><td>A</td><td>(1) suffit seule, (2) ne suffit pas</td></tr><tr><td>B</td><td>(2) suffit seule, (1) ne suffit pas</td></tr><tr><td>C</td><td>Aucune ne suffit seule, les deux ensemble suffisent</td></tr><tr><td>D</td><td>Chacune suffit seule</td></tr><tr><td>E</td><td>Même ensemble, elles ne suffisent pas</td></tr></table><p style="margin:12px 0 0">L’arbre de décision : si (1) suffit, on teste (2) : oui donne D, non donne A. Si (1) ne suffit pas et que (2) suffit : B. Si aucune ne suffit seule : ensemble, oui donne C, non donne E.</p>`,
ex:{enonce:'Que vaut x ? (1) 2x + y = 10. (2) x − y = 2.',steps:['(1) seule : une équation, deux inconnues. Infinité de solutions : ne suffit pas.','(2) seule : même problème, ne suffit pas.','Ensemble : deux équations indépendantes pour deux inconnues. On peut trouver x (x = 4). Réponse C.']},
trou:{enonce:'Tous les stylos ont le même prix. Combien coûte un stylo ? (1) 4 stylos coûtent 6 €. (2) 10 stylos coûtent 15 €.',steps:['(1) seule : 6 ÷ 4 = 1,50 €. Suffit.','(2) seule : 15 ÷ 10 = 1,50 €. Suffit.','Chacune suffit seule : réponse D.'],blank:2,choices:['Chacune suffit seule : réponse D.','Il faut les deux : réponse C.','Seule la (1) compte : réponse A.'],ok:0},
pieges:['Utiliser sans s’en rendre compte l’information (1) quand on teste la (2) seule.','Oublier de tester la (2) quand la (1) suffit déjà : la réponse est peut-être D, pas A.','Finir tous les calculs : c’est du temps perdu.'],
reflexe:'Quand tu testes (2), cache mentalement (1). Et arrête-toi dès que tu sais qu’une valeur unique existe.',
cartes:[['Réponse A ?','(1) suffit seule, (2) ne suffit pas.'],['Réponse B ?','(2) suffit seule, (1) ne suffit pas.'],['Réponse C ?','Aucune seule, mais les deux ensemble suffisent.'],['Réponse D ?','Chacune suffit seule.'],['Réponse E ?','Même ensemble, elles ne suffisent pas.'],['Dans quel ordre tester ?','(1) seule, puis (2) seule, puis les deux ensemble.']]},

{id:'cm-ouv',sub:'cm',bloc:'Méthode',title:'Questions ouvertes et fermées',book:'fiches 101 et 102 (p. 334 à 337)',pre:['cm-grille'],
intuition:`Question <b>ouverte</b> (« combien vaut x ? ») : l’information suffit si elle donne une valeur unique. Question <b>fermée</b> (« x est-il positif ? ») : elle suffit si elle donne une réponse certaine, oui ou non. Un « non » certain suffit autant qu’un « oui » ! Pour prouver qu’une information ne suffit pas, il suffit de trouver deux cas qui donnent des réponses différentes.`,
regle:`<ul><li>Question fermée : chercher un contre-exemple. Deux cas compatibles avec l’information mais qui donnent des réponses différentes : insuffisant</li><li>Valeurs à tester : 0, 1, un négatif, une fraction entre 0 et 1, un grand nombre</li><li>x² = 16 ne donne pas x = 4, mais x = 4 ou x = −4</li><li>x² &gt; x est vrai pour x &gt; 1 ou x &lt; 0, faux entre 0 et 1</li></ul>`,
ex:{enonce:'x est-il supérieur à y ? (1) x − y = 3. (2) x² > y².',steps:['(1) seule : x = y + 3, donc x est toujours plus grand. Oui, certain : suffit.','(2) seule : x = 3, y = 1 donne oui ; x = −3, y = 1 donne non. Deux réponses : ne suffit pas.','Réponse A.']},
trou:{enonce:'x est-il positif ? (1) x² = 16.',steps:['x² = 16 donne x = 4 ou x = −4.','Deux réponses possibles : oui et non.','L’information ne suffit pas.'],blank:0,choices:['x² = 16 donne x = 4 ou x = −4.','x² = 16 donne x = 4 uniquement.','x² = 16 donne x = 8.'],ok:0},
pieges:['Croire qu’une information qui répond « non » ne suffit pas : un non certain est une réponse.','Ne tester que des entiers positifs : les négatifs et les fractions cassent souvent le raisonnement.'],
reflexe:'Sur une question fermée, cherche activement le cas qui fait échouer : teste 0, 1, −1 et 1/2 en quelques secondes.',
cartes:[['Question fermée : une information qui donne toujours « non » ?','Elle suffit : la réponse est certaine.'],['Quelles valeurs tester pour trouver un contre-exemple ?','0, 1, un négatif, une fraction entre 0 et 1.'],['x² = 25 : que vaut x ?','5 ou −5 : pas de valeur unique.'],['Quand a-t-on x² > x ?','Pour x > 1 ou x < 0 (faux entre 0 et 1).']]},

{id:'cm-parite',sub:'cm',bloc:'Méthode',title:'Parité et signes',book:'fiche 116 (p. 364)',pre:['cm-grille'],
intuition:`La parité (pair ou impair) obéit à des règles simples, qui reviennent souvent en Conditions minimales. L’astuce : il suffit de tester un nombre pair et un nombre impair (2 et 1, par exemple) pour trancher.`,
regle:`<ul><li>pair + pair = pair ; impair + impair = pair ; pair + impair = impair</li><li>pair × n’importe quoi = pair ; impair × impair = impair</li><li>n² a la même parité que n ; n(n + 1) est toujours pair</li><li>0 est pair</li><li>Signes : a × b &lt; 0 si a et b sont de signes contraires ; a × b &gt; 0 s’ils ont le même signe</li></ul>`,
ex:{enonce:'n est un entier. n² + 3n est-il pair ?',steps:['n² + 3n = n × (n + 3).','Si n est pair, le produit est pair. Si n est impair, n + 3 est pair, donc le produit est pair.','Toujours pair.']},
trou:{enonce:'a et b sont des entiers et a + b est impair. a × b est-il pair ?',steps:['a + b impair : l’un est pair, l’autre impair.','pair × impair = pair.','a × b est pair.'],blank:0,choices:['a + b impair : l’un est pair, l’autre impair.','a + b impair : les deux sont impairs.','a + b impair : les deux sont pairs.'],ok:0},
pieges:['Un produit pair ne signifie pas que les deux facteurs sont pairs : un seul suffit.','Oublier que 0 est pair, et qu’un entier peut être négatif.'],
reflexe:'Remplace par 1, puis par 2 : deux essais suffisent presque toujours pour conclure sur la parité.',
cartes:[['impair + impair ?','pair.'],['impair × impair ?','impair.'],['n(n + 1) ?','Toujours pair (deux entiers consécutifs).'],['0 est-il pair ?','Oui.'],['a × b < 0 ?','a et b sont de signes contraires.']]},

{id:'logi-methode',sub:'logi',bloc:'Séries',title:'Méthode générale et écarts',book:'fiches 159, 162 et 163 (p. 514 à 523)',

regle:`<ol><li>Écarts entre termes consécutifs : constants ? croissants ?</li><li>Écarts des écarts</li><li>Rapports : × 2, × 3, parfois × 2 + 1</li><li>Alternance : deux séries mêlées, un terme sur deux</li><li>Nombres remarquables : carrés, cubes, premiers</li><li>Chaque terme est la somme des deux précédents</li></ol>`,
ex:{enonce:'Quel nombre complète la série 3, 5, 9, 17, 33, ?',steps:['Écarts : 2, 4, 8, 16.','Les écarts doublent : le suivant est 32.','33 + 32 = 65.']},
trou:{enonce:'Quel nombre complète la série 2, 5, 10, 17, 26, ?',steps:['Écarts : 3, 5, 7, 9.','Les écarts augmentent de 2 : le suivant est 11.','26 + 11 = 37.'],blank:1,choices:['Les écarts augmentent de 2 : le suivant est 11.','Les écarts sont impairs : le suivant est 13.','L’écart moyen est 6 : le suivant est 6.'],ok:0},
pieges:['Les leurres : une réponse qui prolonge une règle valable sur les trois premiers termes seulement.','Valider une règle sans la vérifier sur tous les termes.'],
reflexe:'Écris les écarts sous la série dès la première seconde : la grande majorité des séries se résolvent aux étapes 1 à 3.',
cartes:[['Première chose à faire devant une série ?','Écrire les écarts entre termes consécutifs.'],['Écarts 2, 4, 8, 16 ?','Ils doublent : prochain écart 32.'],['La série monte et descend en zigzag ?','Sans doute une alternance : lire un terme sur deux.'],['Comment éviter un leurre ?','Vérifier la règle sur tous les termes.']]},

{id:'logi-remarquables',sub:'logi',bloc:'Séries',title:'Nombres remarquables',book:'fiches 180 à 182 (p. 560 à 565)',skill:'carres',pre:['logi-methode'],

{id:'logi-lettres',sub:'logi',bloc:'Séries',title:'Séries de lettres',book:'fiches 161 et 183 (p. 518 et p. 568)',skill:'lettres',pre:['logi-methode'],

{id:'logi-grilles',sub:'logi',bloc:'Grilles',title:'Grilles de nombres',book:'fiches 165 à 171 (p. 528 à 541)',pre:['logi-methode'],
intuition:`Dans une grille, la règle circule dans une direction. Au lieu de fixer la case vide, on teste les directions une par une : chaque ligne, puis chaque colonne, puis la relation entre colonnes, puis les sommes.`,
regle:`<ol><li>Chaque ligne suit-elle la même règle (écart, ×) ?</li><li>Chaque colonne ?</li><li>Une colonne se calcule-t-elle à partir des deux autres (somme, produit, différence) ?</li><li>Les lignes ou les colonnes ont-elles une somme constante ?</li><li>Les diagonales</li></ol>`,
ex:{enonce:'Quelle est la case manquante ?',grid:[[2,4,6],[3,6,9],[4,8,'?']],steps:['Ligne 1 : écart de 2. Ligne 2 : écart de 3.','Ligne 3 : 4, 8… écart de 4.','8 + 4 = 12.']},
trou:{enonce:'Quelle est la case manquante ?',grid:[[5,3,7],[4,9,2],[6,1,'?']],steps:['Somme de la ligne 1 : 5 + 3 + 7 = 15.','Somme de la ligne 2 : 4 + 9 + 2 = 15.','6 + 1 + ? = 15, donc ? = 8.'],blank:2,choices:['6 + 1 + ? = 15, donc ? = 8.','6 + 1 = 7, donc ? = 7.','Écart de 3 : ? = 6 + 3 = 9.'],ok:0},
pieges:['S’acharner sur les lignes alors que la règle est en colonnes.','Oublier qu’une colonne peut être le résultat des deux autres (c = a + b, c = a × b).'],
reflexe:'Commence par une ligne ou une colonne complète : c’est elle qui donne la règle. La case vide ne sert qu’à l’appliquer.',
cartes:[['Dans quel ordre tester une grille ?','Lignes, colonnes, relation entre colonnes, sommes constantes, diagonales.'],['Somme constante : comment trouver la case vide ?','Somme d’une ligne complète, moins les nombres connus de la ligne incomplète.'],['Une colonne dépend des deux autres ?','Tester somme, produit et différence sur une ligne complète.']]}
];
const CBYID=Object.fromEntries(CONCEPTS.map(c=>[c.id,c]));
const SKILL_NAMES={mult:'Calcul mental',frac:'Fractions',pct:'Pourcentages',carres:'Carrés et puissances',lettres:'Rangs des lettres'};
const BOOKP={calc:{1:199,2:208,3:219},cm:{1:379,2:390,3:401},logi:{1:605,2:615,3:625},blanc:{4:714,5:786,6:856,7:925,8:994}};
/* ============ Générateurs de questions (une nouvelle variante à chaque fois) ============ */
function swapAB(t){const sw=s=>s.replace(/\(1\)/g,'§§').replace(/\(2\)/g,'(1)').replace(/§§/g,'(2)');return Object.assign({},t,{i1:t.i2,i2:t.i1,a:t.a===0?1:t.a===1?0:t.a,ex:sw(t.ex)})}
const maybeSwap=t=>Math.random()<.5?t:swapAB(t);
const cmQ=t=>Object.assign({cm:true,opts:CM_OPTS},t);
const ser=(arr,f=fr)=>`<div class="series">${arr.map(f).join(', ')}, ?</div>`;

const G={};
G['calc-mental']=()=>{
  const t=pick(['x25','x11','x99','n5','x5','x9']);let a,ans,q,ex;
  if(t==='x25'){a=R(12,96);ans=a*25;q=`${a} × 25 = ?`;ex=`× 25, c’est × 100 puis ÷ 4 : ${fr(a*100)} ÷ 4 = ${fr(ans)}.`}
  else if(t==='x11'){a=R(12,98);ans=a*11;const d=Math.floor(a/10),u=a%10;q=`${a} × 11 = ?`;ex=`× 11 : on écrit ${d}, puis ${d} + ${u} = ${d+u}, puis ${u}${d+u>=10?' (le 1 de '+(d+u)+' part en retenue sur le '+d+')':''}. Résultat : ${fr(ans)}.`}
  else if(t==='x99'){a=R(13,89);ans=a*99;q=`${a} × 99 = ?`;ex=`× 99, c’est × 100 moins le nombre : ${fr(a*100)} − ${a} = ${fr(ans)}.`}
  else if(t==='n5'){const n=R(1,9);a=n*10+5;ans=a*a;q=`${a}² = ?`;ex=`Nombre qui finit par 5 : ${n} × ${n+1} = ${n*(n+1)}, puis on accole 25. Résultat : ${fr(ans)}.`}
  else if(t==='x5'){a=R(112,988);ans=a*5;q=`${a} × 5 = ?`;ex=`× 5, c’est × 10 puis ÷ 2 : ${fr(a*10)} ÷ 2 = ${fr(ans)}.`}
  else {a=R(23,97);ans=a*9;q=`${a} × 9 = ?`;ex=`× 9, c’est × 10 moins le nombre : ${a*10} − ${a} = ${ans}.`}
  return Object.assign({q:`Calculer de tête : <span class="mono">${q}</span>`,ex},numOpts(ans,[ans+10,ans-10,ans+100,ans-100,ans+1,ans+a,ans-a]));
};
G['calc-fractions']=()=>{
  const t=pick(['of','div','dec','sum']);
  if(t==='of'){const m=pick([3,4,5,6,8]);let k;do{k=R(1,m-1)}while(gcd(k,m)!==1);const n=m*R(3,18),ans=k*n/m;
    return Object.assign({q:`Combien font les ${k}/${m} de ${n} ?`,ex:`On divise d’abord, les nombres restent petits : ${n} ÷ ${m} = ${n/m}, puis × ${k} = ${ans}.`},numOpts(ans,[n/m,ans+n/m,ans-n/m,n-ans,k*n]))}
  if(t==='div'){const [x,inv,lab]=pick([[0.25,4,'× 4'],[0.5,2,'× 2'],[0.75,4/3,'× 4/3'],[0.125,8,'× 8'],[0.2,5,'× 5']]);const n=x===0.75?3*R(4,30):R(6,60);const ans=Math.round(n*inv);
    return Object.assign({q:`Combien font ${fr(n)} ÷ ${fr(x,3)} ?`,ex:`Diviser par ${fr(x,3)}, c’est multiplier par l’inverse (${lab}) : ${fr(ans)}. Diviser par un nombre plus petit que 1 agrandit.`},numOpts(ans,[n*x,ans/2,ans*2,n/(x*10),ans+n]))}
  if(t==='dec'){const T=[['1/8','0,125'],['3/8','0,375'],['5/8','0,625'],['7/8','0,875'],['1/6','≈ 0,167'],['5/6','≈ 0,833'],['2/3','≈ 0,667'],['1/12','≈ 0,083'],['3/4','0,75'],['4/5','0,8'],['1/9','≈ 0,111'],['3/5','0,6']];
    const [f,v]=pick(T);const others=shuffle(T.filter(x=>x[1]!==v)).map(x=>x[1]);
    const o=strOpts(v,others);return Object.assign({q:`Quelle est la valeur décimale de ${f} ?`,ex:`${f} = ${v.replace('≈ ','environ ')}. Repère utile : 1/8 = 0,125, 1/6 ≈ 0,167, 1/3 ≈ 0,333.`},o)}
  const b=pick([2,3,4,5,6]),d=pick([3,4,6,8,9,10].filter(x=>x!==b));const a=R(1,b-1),c=R(1,d-1);
  const num=a*d+c*b,den=b*d,g=gcd(num,den);const ans=`${num/g}/${den/g}`;
  const val=num/den;const cands=[[a+c,b+d],[a*c,b*d],[a+c,b*d],[num+1,den],[num-1,den],[num,den*2]].filter(([p,q])=>q>0&&p>0&&Math.abs(p/q-val)>1e-9).map(([p,q])=>{const h=gcd(p,q);return `${p/h}/${q/h}`});
  return Object.assign({q:`Combien font ${a}/${b} + ${c}/${d} ?`,ex:`Même dénominateur (${den}) : ${a*d}/${den} + ${c*b}/${den} = ${num}/${den}${g>1?` = ${ans}`:''}. On n’additionne jamais les dénominateurs.`},strOpts(ans,cands));
};
G['calc-pct']=()=>{
  const t=pick(['of','succ','init','rate']);
  if(t==='of'){const p=pick([5,10,15,20,25,30,35,40,60,75]),n=20*R(2,30),ans=p*n/100;
    return Object.assign({q:`Combien font ${p} % de ${n} ?`,ex:`10 % de ${n} = ${fr(n/10)}. Donc ${p} % = ${fr(n/10)} × ${fr(p/10)} = ${fr(ans)}.`},numOpts(ans,[ans+n/20,ans-n/20,p*n/10,ans*2,n-ans]))}
  if(t==='succ'){const a=pick([10,20,25,30,50]),b=pick([10,20,25,40,50]);const up=Math.random()<.5;
    const c1=up?1+a/100:1-a/100,c2=up?1-b/100:1+b/100,coef=c1*c2,ch=Math.round((coef-1)*10000)/100;
    const txt=up?`augmente de ${a} %, puis baisse de ${b} %`:`baisse de ${a} %, puis augmente de ${b} %`;
    return Object.assign({q:`Un prix ${txt}. Quelle est l’évolution globale ?`,ex:`Coefficients : × ${fr(c1)} puis × ${fr(c2)}, soit × ${fr(coef,4)}. Évolution : ${pctS(ch)}. On ne fait jamais la somme des pourcentages (qui donnerait ${pctS(up?a-b:b-a)}).`},numOpts(ch,[up?a-b:b-a,ch+1,ch-1,ch+2,-ch,ch-2],pctS))}
  if(t==='init'){const up=Math.random()<.6;const tt=up?pick([10,20,25,50]):pick([10,20,25,40]);const init=20*R(2,20);const coef=up?1+tt/100:1-tt/100;const fin=Math.round(init*coef*100)/100;
    return Object.assign({q:`Après ${up?'une hausse':'une baisse'} de ${tt} %, un article coûte ${eur(fin)}. Quel était son prix de départ ?`,ex:`Coefficient × ${fr(coef)}. On revient en arrière en divisant : ${eur(fin)} ÷ ${fr(coef)} = ${eur(init)}. Piège : ${up?'retirer':'ajouter'} ${tt} % au prix final donne ${eur(fin*(up?1-tt/100:1+tt/100))}, ce qui est faux.`},numOpts(init,[fin*(up?1-tt/100:1+tt/100),up?fin-tt:fin+tt,init+10,init-10,fin],eur))}
  const A=20*R(2,20),c=pick([5,10,15,20,25,30,40,50,-10,-20,-25,-40]),B=A*(1+c/100);
  return Object.assign({q:`Une valeur passe de ${fr(A)} à ${fr(B)}. Quel est le taux d’évolution ?`,ex:`(${fr(B)} − ${fr(A)}) ÷ ${fr(A)} = ${fr(c/100)}, soit ${pctS(c)}. On divise toujours par la valeur de départ.`},numOpts(c,[Math.round((B-A)/B*10000)/100,c+5,c-5,-c,c+10],pctS));
};
G['calc-prop']=()=>{
  const t=pick(['direct','inverse','multiple']);
  if(t==='direct'){const k=pick([3,4,5,6,8]),u=pick([1.5,2,2.5,3,1.2,0.75,3.5]),m=pick([7,9,10,12,15].filter(x=>x!==k)),tot=k*u,ans=m*u;
    return Object.assign({q:`${k} carnets coûtent ${eur(tot)}. Combien coûtent ${m} carnets ?`,ex:`Prix d’un carnet : ${eur(tot)} ÷ ${k} = ${eur(u)}. Pour ${m} : ${m} × ${eur(u)} = ${eur(ans)}.`},numOpts(ans,[ans+u,ans-u,tot+m,tot*m/10,ans+2*u],eur))}
  if(t==='inverse'){const w=pick([3,4,5,6,8]),d=pick([10,12,15,18,20,24]),work=w*d;const cand=[2,3,4,5,6,8,9,10,12].filter(x=>x!==w&&work%x===0);const w2=pick(cand),ans=work/w2;
    return Object.assign({q:`${w} ouvriers construisent un mur en ${d} jours. Combien de jours faut-il à ${w2} ouvriers travaillant au même rythme ?`,ex:`Situation inverse : le produit reste constant. Travail total : ${w} × ${d} = ${work} jours-ouvrier. Avec ${w2} ouvriers : ${work} ÷ ${w2} = ${fr(ans)} jours.`},numOpts(ans,[d*w2/w,ans+1,ans-1,ans+2,d]))}
  const m1=pick([2,3,4]),h1=pick([2,3,4,5]),r=pick([5,6,8,10,12,15]),p1=m1*h1*r,m2=pick([4,5,6,8].filter(x=>x!==m1)),h2=pick([3,4,6,7].filter(x=>x!==h1)),ans=m2*h2*r;
  return Object.assign({q:`${m1} machines fabriquent ${p1} pièces en ${h1} heures. Combien de pièces fabriquent ${m2} machines en ${h2} heures ?`,ex:`Une machine fait ${p1} ÷ (${m1} × ${h1}) = ${r} pièces par heure. Donc ${m2} × ${h2} × ${r} = ${ans} pièces.`},numOpts(ans,[p1*m2/m1,p1*h2/h1,ans+r,ans-r,ans+m2*r]));
};
G['calc-moy']=()=>{
  const t=pick(['missing','pond','retrait']);
  if(t==='missing'){let n,m,tg,x;do{n=pick([3,4,5,6]);m=R(9,14);tg=m+R(1,2);x=tg*(n+1)-m*n}while(x>20||x<0);
    return Object.assign({q:`La moyenne de ${n} notes est ${m}. Quelle note faut-il obtenir à la suivante pour avoir ${tg} de moyenne ?`,ex:`Total actuel : ${n} × ${m} = ${n*m}. Total visé : ${n+1} × ${tg} = ${tg*(n+1)}. Note nécessaire : ${tg*(n+1)} − ${n*m} = ${x}.`},numOpts(x,[2*tg-m,x+1,x-1,x+2,tg]))}
  if(t==='pond'){let nA,mA,nB,mB,ans,k=0;do{nA=pick([10,20,30]);mA=R(12,24);nB=pick([10,20,30,40].filter(v=>v!==nA));mB=R(8,16);ans=(nA*mA+nB*mB)/(nA+nB);k++}while((!Number.isInteger(ans)||mA===mB)&&k<200);
    return Object.assign({q:`Un groupe de ${nA} personnes a une moyenne d’âge de ${mA} ans ; un autre groupe de ${nB} personnes, de ${mB} ans. Quelle est la moyenne d’âge de l’ensemble ?`,ex:`Total : ${nA} × ${mA} + ${nB} × ${mB} = ${nA*mA+nB*mB}. Effectif : ${nA+nB}. Moyenne : ${fr(ans)} ans. La moyenne simple (${fr((mA+mB)/2)}) est un piège : les groupes n’ont pas la même taille.`},numOpts(ans,[(mA+mB)/2,ans+1,ans-1,ans+2]))}
  let n,m,x,ans,k=0;do{n=pick([5,6,8,10]);m=R(12,20);x=R(m+3,m+18);ans=(n*m-x)/(n-1);k++}while(!Number.isInteger(ans)&&k<300);
  return Object.assign({q:`La moyenne de ${n} nombres est ${m}. On retire le nombre ${x}. Quelle est la nouvelle moyenne ?`,ex:`Total : ${n} × ${m} = ${n*m}. Sans ${x} : ${n*m-x}, pour ${n-1} nombres. Moyenne : ${fr(ans)}.`},numOpts(ans,[ans+1,ans-1,m,(n*m-x)/n,ans-2]));
};
G['calc-vitesse']=()=>{
  const t=pick(['dist','ar','crois','ratt']);
  if(t==='dist'){let v,tm,d;do{v=pick([36,40,45,48,60,72,75,80,90,96,120]);tm=pick([15,20,25,40,45,50,75,80,90,100]);d=v*tm/60}while(!Number.isInteger(d));
    const trap=tm>=60?v*(1+(tm-60)/100):v*tm/100;
    return Object.assign({q:`Un véhicule roule à ${v} km/h pendant ${fmtH(tm/60)}. Quelle distance parcourt-il ?`,ex:`${fmtH(tm/60)} = ${tm}/60 h = ${fr(tm/60,3)} h. Distance : ${v} × ${fr(tm/60,3)} = ${fr(d)} km.${tm>=60?` Piège : ${fmtH(tm/60)} ne vaut pas ${fr(1+(tm-60)/100)} h.`:''}`},numOpts(d,[trap,d+5,d-5,d*1.2,d+10],x=>fr(x)+' km'))}
  if(t==='ar'){const [v1,v2,ans]=pick([[60,40,48],[30,60,40],[60,90,72],[80,120,96],[45,90,60],[20,30,24],[50,75,60],[100,150,120],[60,120,80],[40,60,48]]);
    return Object.assign({q:`Un trajet se fait à l’aller à ${v1} km/h et au retour à ${v2} km/h. Quelle est la vitesse moyenne sur l’aller-retour ?`,ex:`2 × ${v1} × ${v2} ÷ (${v1} + ${v2}) = ${2*v1*v2} ÷ ${v1+v2} = ${ans} km/h. La moyenne des vitesses (${fr((v1+v2)/2)}) est le piège : on passe plus de temps à la vitesse lente.`},numOpts(ans,[(v1+v2)/2,ans+4,ans-4,ans+8,ans-6],x=>fr(x)+' km/h'))}
  if(t==='crois'){const v1=pick([40,50,60,70,80]),v2=pick([30,50,60,90,100].filter(x=>x!==v1)),tt=pick([1.5,2,2.5,3]),d=(v1+v2)*tt;

  let v1,v2,h0,ans,k=0;do{v1=pick([12,15,20,30,40]);v2=v1+pick([10,20,30,40]);h0=pick([0.5,1,1.5,2]);ans=v1*h0/(v2-v1);k++}while((!Number.isInteger(Math.round(ans*60*1000)/1000)||ans>4||ans*60<10)&&k<300);

const DAY=864e5,MIN=6e4;

const retr=(t,s)=>Math.pow(1+t/(9*s),-1);
function nextState(st,g,now=Date.now()){
  st=st||{};let s,d,lapses=st.lapses||0;
  if(!st.reps){s=initS(g);d=initD(g)}
  else{const t=Math.max(0,(now-st.last)/DAY);const r=retr(t,st.s);d=st.d-0.6*(g-3);d=Math.min(10,Math.max(1,0.9*d+0.5));

}

function mastery(cid){

function weightedConcepts(list,n){const out=[];let last=null;for(let i=0;i<n;i++){const pool=list.filter(c=>c.id!==last);const src=pool.length?pool:list;const w=src.map(c=>5-Math.min(mastery(c.id),4));const tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot,k=0;for(;k<src.length-1;k++){x-=w[k];if(x<=0)break}out.push(src[k]);last=src[k].id}return out}

function buildDaily(mins,dry){
  const now=Date.now(),steps=[];let budget=mins*60;
  const studied=studiedList();const skills=studied.filter(c=>c.skill);
  const full=mins>=20;
  if(full&&skills.length){steps.push({k:'warm',dur:180});budget-=180}
  const nc=(full&&newToday()<S.settings.newPerDay)?nextConcept():null;
  const nc2=(nc&&!studied.length&&newToday()+1<S.settings.newPerDay)?nextConcept(nc):null;
  const doSprint=full&&studied.length>=2&&!lastSessionSprint();
  const revBudget=full?budget-(nc?600:0)-(doSprint?420:0):budget;
  const due=dueList(now);const by={calc:[],logi:[],cm:[]};due.forEach(id=>by[DEFS[id].sub].push(id));
  const order=[];while(order.length<due.length){for(const s of ['calc','logi','cm']){const x=by[s].shift();if(x)order.push(x)}}
  let t=0,nrev=0;for(const id of order){const e=est(DEFS[id].type);if(t+e>revBudget&&t>0)break;steps.push(stepFor(id));t+=e;nrev++}
  const remaining=revBudget-t;
  if(nc)steps.push({k:'concept',cid:nc.id});
  if(nc2)steps.push({k:'concept',cid:nc2.id});
  let nextra=0;
  if(studied.length&&remaining>150){nextra=Math.min(full?8:6,Math.floor(remaining/est('p')));weightedConcepts(studied,nextra).forEach(c=>steps.push({k:'prob',id:c.id+':p',cid:c.id,extra:true}))}
  if(doSprint)steps.push({k:'sprint',n:5});
  if(!dry)steps.push({k:'bilan'});
  return {kind:full?'daily':'short',mins,steps,i:0,start:now,log:[],sprinted:doSprint,nrev,nextra,nc:nc?nc.id:null,nc2:nc2?nc2.id:null,estSec:(steps.some(s=>s.k==='warm')?180:0)+t+(nc?600:0)+(nc2?600:0)+nextra*est('p')+(doSprint?420:0)};
}

function forecastHTML(){const now=Date.now();const start=new Date();start.setHours(0,0,0,0);const days=[];for(let i=0;i<7;i++){const a=start.getTime()+i*DAY,b=a+DAY;const n=Object.entries(S.cards).filter(([id,st])=>DEFS[id]&&DEFS[id].type!=='ref'&&(i===0?st.due<b:st.due>=a&&st.due<b)).length;days.push(n)}const mx=Math.max(1,...days);const names=['Auj.','Dem.'];for(let i=2;i<7;i++)names.push(new Date(start.getTime()+i*DAY).toLocaleDateString('fr-FR',{weekday:'short'}).replace('.',''));

function bookPage(sub,n){n=+n;return n<=3?BOOKP[sub][n]:BOOKP.blanc[n]||null}

function viewProg(){
  let h=brand()+`<h1>Progrès</h1>`+`<div class="syncline ${SYNC.state==='sync'?'':'off'}" style="margin-bottom:6px"><i></i>${SYNC.state==='sync'?'Synchronisé sur tous tes appareils':SYNC.state==='connecting'?'Connexion en cours…':'Enregistré sur cet appareil uniquement'}</div>`;

    let est=null;if(res.length>=5){const pts=res.reduce((a,r)=>a+(r.r==='ok'?4:r.r==='ko'?-1:0),0)/res.length;est=Math.round(pts*15)}
    h+=`<div class="srow2"><div class="top"><b>${SUBS[s]}</b><span class="mono" style="font-size:20px">${est!=null?est+' / 60':'?'}</span></div><div class="meter"><i style="width:${Math.max(0,(est||0))/60*100}%"></i></div><p class="small muted" style="margin:6px 0 0">${est!=null?`D’après tes ${res.length} dernières réponses en sprint.`:'Estimation disponible après 5 réponses en sprint.'}${lb?` Dernier test du livre : ${lb.score} / 60.`:''}</p></div>`}
  h+='</div>';
  const now=Date.now();const rv=S.reviews.filter(r=>r.rev&&now-r.t<30*DAY&&r.type!=='ref');const ret=rv.length?Math.round(rv.filter(r=>r.g>1).length/rv.length*100):null;
  const tms=S.reviews.filter(r=>r.type==='p'&&r.ms).slice(-40).map(r=>r.ms/1000).concat(S.sprints.slice(-6).flatMap(x=>x.res.filter(r=>r.ms).map(r=>r.ms/1000)));const tavg=tms.length?Math.round(tms.reduce((a,b)=>a+b,0)/tms.length):null;
  h+=`<h2>Mémoire et rythme</h2><div class="kpis"><div class="kpi"><b>${ret!=null?ret+' %':'?'}</b><span>rétention sur 30 jours</span></div><div class="kpi"><b>${tavg!=null?tavg+' s':'?'}</b><span>par question (cible 80 s)</span></div><div class="kpi"><b>${S.reviews.length}</b><span>réponses au total</span></div></div>`;
  h+=`<p class="small muted" style="margin-top:8px">La rétention mesure la part des révisions réussies. Autour de 85 à 90 %, l’espacement est bien réglé.</p>`;

  h+=`<h2>Fiabilité de ta confiance</h2><div class="card"><p class="small muted">Quand tu dis être sûre, tu devrais avoir juste presque toujours. Si ce n’est pas le cas, prends l’habitude de vérifier avant de répondre.</p><div class="kpis"><div class="kpi"><b>${pc(cf.sure)}</b><span>justes quand « sûre »</span></div><div class="kpi"><b>${pc(cf.mid)}</b><span>quand « j’hésite »</span></div><div class="kpi"><b>${pc(cf.guess)}</b><span>« au hasard »</span></div></div></div>`;
  if(S.book.length){const causes={};S.errs.forEach(e=>{causes[e.cause]=(causes[e.cause]||0)+1});h+=`<h2>Tests du livre</h2><div class="card">${S.book.slice(-8).reverse().map(b=>`<div class="srow2"><div class="top"><span>${SUBS[b.sub]}, ${b.test<=3?'mini-test':'test blanc'} n° ${b.test}</span><b class="mono">${b.score} / 60</b></div><p class="small muted" style="margin:4px 0 0">${new Date(b.t).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} : ${b.ok} justes, ${b.ko} fausses, ${b.skip} passées</p></div>`).join('')}</div>`;
    if(Object.keys(causes).length)h+=`<p class="small" style="margin-top:10px">Causes de tes erreurs : ${Object.entries(causes).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k.toLowerCase()} (${v})`).join(', ')}.</p>`}

/* ============ Session ============ */
function blockLabel(st){if(!st)return '';const d=DEFS[st.id];return {warm:'Réflexes',card:d&&d.type==='err'?'Erreur du livre à revoir':'Révision',prob:st.extra?'Exercice mêlé':'Révision',recog:'Reconnaître la méthode',concept:'Nouveau concept',sprint:'Sprint chrono',book:'Test du livre',bilan:'Bilan'}[st.k]}
function clockInfo(){if(!SES)return {t:'',w:false};const st=SES.steps[SES.i];const mm=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  if(st&&st.k==='sprint'&&st.phase==='run'){const r=(st.dur-(Date.now()-st.start))/1000;return {t:mm(r),w:r<60}}
  if(st&&st.k==='book'&&st.phase==='run'){const r=(st.dur-(Date.now()-st.start))/1000;return {t:mm(r),w:r<120}}
  if(st&&st.k==='warm'&&st.start){const r=st.dur-(Date.now()-st.start)/1000;return {t:mm(r),w:r<15}}
  return {t:mm((Date.now()-SES.start)/1000),w:false}}
function viewSession(){
  const st=SES.steps[SES.i];const ci=clockInfo();const pct=Math.round(SES.i/Math.max(1,SES.steps.length-1)*100);
  let h=`<div class="topbar"><button class="icon" data-a="quit" aria-label="Quitter la session">✕</button><div class="tb-mid"><div class="tb-label">${blockLabel(st)}</div><div class="prog"><i style="width:${pct}%"></i></div></div><div class="clock ${ci.w?'warn':''}" id="clock">${ci.t}</div></div>`;
  const V={warm:vWarm,card:vCard,prob:vProb,recog:vRecog,concept:vConcept,sprint:vSprint,book:vBook,bilan:vBilan};
  return h+(V[st.k]||(()=>''))(st);
}

function vWarm(st){
  if(!st.res)st.res={};
  return `<div class="warm"><p class="muted">Réponds vite, de tête. Une virgule pour les décimaux.</p><div class="wq" id="wq">…</div><input id="ans" class="ansin" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><div style="margin-top:14px"><button class="btn primary" style="min-width:200px" data-a="warmOk">Valider</button></div><div class="wfb" id="wfb"></div>${st.start?'':`<button class="btn" style="margin-top:20px" data-a="warmGo">Démarrer</button>`}</div>`;
}
function warmSkills(st){const s=st.all?Object.keys(REF):studiedList().filter(c=>c.skill).map(c=>c.skill);return s.length?s:['mult']}
function warmNext(st){const sk=pick(warmSkills(st));st.cur=Object.assign({skill:sk,t0:Date.now()},REF[sk]());const wq=$('#wq'),inp=$('#ans'),fb=$('#wfb');if(wq)wq.innerHTML=st.cur.q;if(inp){inp.value='';inp.setAttribute('inputmode',st.cur.mode);inp.setAttribute('autocapitalize',st.cur.mode==='text'?'characters':'off');inp.focus()}if(fb){fb.textContent='';fb.className='wfb'}}
function warmSubmit(){const st=SES.steps[SES.i];if(!st.cur||st.busy)return;const inp=$('#ans');const v=inp?inp.value:'';if(!v.trim())return;const ok=norm(v)===norm(st.cur.ans);const ms=Date.now()-st.cur.t0;const r=st.res[st.cur.skill]||(st.res[st.cur.skill]={n:0,ok:0,ms:0});r.n++;if(ok)r.ok++;r.ms+=ms;
  const fb=$('#wfb');if(fb){fb.className='wfb '+(ok?'ok':'ko');fb.textContent=ok?'Juste':'Réponse : '+st.cur.ans}st.busy=true;st.cur=null;
  setTimeout(()=>{st.busy=false;if(Date.now()-st.start>=st.dur*1000)finishWarm();else warmNext(st)},ok?450:1500)}
function finishWarm(){const st=SES.steps[SES.i];if(st.done)return;st.done=true;let n=0,ok=0;for(const [sk,r] of Object.entries(st.res)){n+=r.n;ok+=r.ok;const id='ref:'+sk;if(!S.cards[id])continue;const acc=r.ok/r.n,avg=r.ms/r.n/1000;const g=acc===1&&avg<6?4:acc>=.8?3:acc>=.5?2:1;schedule(id,g,{ms:r.ms/r.n})}save();SES.log.push({k:'warm',n,ok});nextStep()}

function vCard(st){
  const d=DEFS[st.id];if(!d){return `<p>Cette carte n’existe plus.</p><button class="btn" data-a="next">Continuer</button>`}
  if(!st.t0)st.t0=Date.now();
  const cs=S.cards[st.id];let lee=cs&&cs.leech&&d.cid?`<p class="note">Cette carte résiste. Avant de répondre, relis l’exemple résolu. <button class="link" data-a="ovl" data-cid="${d.cid}">Ouvrir la fiche</button></p>`:'';
  let front,back;
  if(d.type==='err'){const e=d.err;front=`<p class="small muted">Erreur du livre, ${SUBS[e.sub]}, ${e.test<=3?'mini-test':'test blanc'} n° ${e.test}, question ${e.q}</p><div class="front">${e.cid?CBYID[e.cid].title:'Question à refaire'}</div><p class="small" style="margin-top:12px">1. Sans regarder, énonce la méthode à voix basse.<br>2. Refais la question ${e.q} dans le livre${bookPage(e.sub,e.test)?` (le test commence p. ${bookPage(e.sub,e.test)})`:''}.</p>`;back=e.cid?`<div class="box" style="text-align:left">${CBYID[e.cid].regle}</div><p style="margin-top:10px"><button class="link" data-a="ovl" data-cid="${e.cid}">Revoir la fiche</button></p>`:'<p>Compare ta résolution avec le corrigé du livre.</p>'}
  else{front=`<p class="small muted">${CBYID[d.cid].title}</p><div class="front">${d.f}</div>`;back=d.b}
  let h=lee+`<div class="card flash">${front}${st.flip?`<div class="back">${back}</div>`:''}</div>`;
  if(!st.flip)h+=`<button class="btn primary block" style="margin-top:16px" data-a="flip">Afficher la réponse</button>`;
  else h+=`<p class="small muted" style="margin-top:14px;text-align:center">Honnêtement, tu t’en souvenais ?</p><div class="grades">${[[1,'À revoir'],[2,'Difficile'],[3,'Correct'],[4,'Facile']].map(([g,l])=>`<button class="btn ${g===1?'g1':''}" data-a="grade" data-g="${g}">${l}<small>${preview(st.id,g)}</small></button>`).join('')}</div>`;
  return h;
}
function vProb(st){
  if(!st.q){st.q=genQ(st.cid);st.phase='ask';st.sel=null;st.t0=Date.now();saveSes()}
  const q=st.q,c=CBYID[st.cid];const cs=S.cards[st.id];
  let left=`<p class="small muted">${SUBS[c.sub]}, ${c.title.toLowerCase()}</p>`;
  if(cs&&cs.leech&&st.phase==='ask')left+=`<p class="note">Ce type de question te résiste. Relis l’exemple résolu avant. <button class="link" data-a="ovl" data-cid="${c.id}">Ouvrir la fiche</button></p>`;
  left+=stemHTML(q)+optsHTML(q,st.sel,st.phase,'pick');
  if(st.phase==='ask'){left+=st.sel==null?`<div class="ask"><button class="btn ghost block" data-a="skipQ">Je ne sais pas</button></div>`:`<div class="ask"><p>Ta confiance ?</p><div class="conf"><button class="btn" data-a="conf" data-c="sure">Sûre</button><button class="btn" data-a="conf" data-c="mid">J’hésite</button><button class="btn" data-a="conf" data-c="guess">Au hasard</button></div></div>`}
  else left+=fbHTML(st,c.id);
  return `<div class="split"><div>${left}</div><div>${scratchHTML('p'+SES.i)}</div></div>`;

function fbHTML(st,cid){
  const ok=st.ok;let v=ok?'Juste':st.sel==null?'Passée':'Faux';
  let h=`<div class="fb"><div class="verdict ${ok?'ok':'ko'}">${v}</div>`;
  if(!ok&&st.conf==='sure')h+=`<p class="note">Tu étais sûre de toi : c’est justement le type d’erreur qu’on retient le mieux une fois corrigée. Prends le temps de lire l’explication.</p>`;
  if(ok&&st.conf==='guess')h+=`<p class="note">Bonne réponse, mais au hasard : elle reviendra vite pour vérifier que la méthode est acquise.</p>`;
  h+=`<p>${st.q.ex}</p>`;

  h+=`<div class="row" style="margin-top:12px"><button class="btn ghost" data-a="ovl" data-cid="${cid}">Revoir la fiche</button><button class="btn primary" data-a="next">Continuer</button></div></div>`;
  return h;
}
function vRecog(st){
  if(!st.q){st.q=recogQ(studiedList('calc').length>=3?studiedList('calc'):CONCEPTS.filter(c=>c.sub==='calc'));st.phase='ask';st.sel=null;st.t0=Date.now();saveSes()}

/* Concept : questions à froid, fiche, quiz */
function vConcept(st){
  const c=CBYID[st.cid];if(!st.phase){st.phase='pre';st.pi=0;st.pre=[genQ(c.id),genQ(c.id)];st.fs={ex:1};st.quiz=[genQ(c.id),genQ(c.id),genQ(c.id),genQ(c.id)];st.qi=0;st.score=0;saveSes()}
  let h=`<h1>${c.title}</h1>`;
  if(st.phase==='pre'){const q=st.pre[st.pi];h+=`<p class="muted">Avant la fiche, ${st.pi===0?'deux questions':'une dernière question'} pour t’échauffer. Pas de note : se tromper maintenant aide à retenir la suite.</p>`;
    h+=`<div class="split"><div>${stemHTML(q)}${optsHTML(q,st.sel,st.sel!=null?'fb':'ask','prePick')}${st.sel!=null?`<div class="fb"><div class="verdict ${st.sel===q.a?'ok':'ko'}">${st.sel===q.a?'Bien joué':'Pas grave'}</div><p class="small">La fiche va t’expliquer la méthode.</p><button class="btn primary block" data-a="preNext">${st.pi===0?'Question suivante':'Ouvrir la fiche'}</button></div>`:''}</div><div>${scratchHTML('pre'+st.pi)}</div></div>`}
  else if(st.phase==='fiche'){h+=ficheHTML(c,st.fs)+`<button class="btn primary block" style="margin-top:26px" data-a="toQuiz">Passer au quiz (4 questions)</button>`}
  else if(st.phase==='quiz'){const q=st.quiz[st.qi];h+=`<p class="muted">Quiz, question ${st.qi+1} sur 4.</p><div class="split"><div>${stemHTML(q)}${optsHTML(q,st.sel,st.sel!=null?'fb':'ask','quizPick')}${st.sel!=null?`<div class="fb"><div class="verdict ${st.sel===q.a?'ok':'ko'}">${st.sel===q.a?'Juste':'Faux'}</div><p>${q.ex}</p><button class="btn primary block" data-a="quizNext">${st.qi<3?'Question suivante':'Terminer'}</button></div>`:''}</div><div>${scratchHTML('quiz'+st.qi)}</div></div>`}
  else{h+=`<div class="card stack"><p class="verdict ${st.score>=3?'ok':''}">${st.score} bonne${st.score>1?'s':''} réponse${st.score>1?'s':''} sur 4</p><p>${st.score>=3?'Belle entrée en matière.':'C’est normal au premier passage : la répétition fera le travail.'} Ce concept entre dans tes révisions. Ses cartes reviendront dès la prochaine session, puis de plus en plus espacées.</p><button class="btn primary block" data-a="next">Continuer</button></div>`}
  return h;
}

/* Sprint */
function vSprint(st){
  if(!st.qs){const pool=studiedList();st.qs=weightedConcepts(pool.length?pool:CONCEPTS.slice(0,1),st.n).map(c=>({cid:c.id,q:genQ(c.id)}));st.ans=Array(st.n).fill(null);st.ms=Array(st.n).fill(0);st.qi=0;st.phase='intro';st.dur=st.n*80000;saveSes()}
  if(st.phase==='intro')return `<div class="card stack"><h1 style="margin-top:0">Sprint chrono</h1><p>${st.n} questions mêlées en ${Math.round(st.dur/60000)} minutes, soit le rythme du TAGE : 80 secondes par question.</p><p>Barème officiel : +4 si c’est juste, −1 si c’est faux, 0 si tu passes. Pas de correction avant la fin.</p><p class="note">Répondre au hasard entre 5 propositions rapporte 0 point en moyenne. Dès que tu peux en éliminer une, répondre devient rentable.</p><button class="btn primary block" data-a="sprintGo">Lancer le chrono</button></div>`;
  if(st.phase==='run'){const it=st.qs[st.qi];const sel=st.cursel;return `<div class="split"><div><p class="small muted">Question ${st.qi+1} sur ${st.n}</p>${stemHTML(it.q)}${optsHTML(it.q,sel,'ask','sprintPick')}<div class="row" style="margin-top:16px"><button class="btn ghost" data-a="sprintSkip">Passer (0 point)</button><button class="btn primary" data-a="sprintOk" ${sel==null?'disabled':''}>Valider</button></div></div><div>${scratchHTML('sp'+st.qi)}</div></div>`}
  const pts=st.qs.reduce((a,it,i)=>a+(st.ans[i]==null?0:st.ans[i]===it.q.a?4:-1),0);const nok=st.qs.filter((it,i)=>st.ans[i]===it.q.a).length;
  let h=`<div class="card"><div class="bigscore"><span class="poster">${pts>0?'+':''}${pts}</span></div><h1 style="margin-top:0;text-align:center">point${Math.abs(pts)>1?'s':''}</h1><p class="muted">${nok} juste${nok>1?'s':''} sur ${st.n}${st.timeout?', temps écoulé':''}. Rapporté à un sous-test de 15 questions : environ ${Math.round(pts/st.n*15)} / 60.</p></div>`;
  h+=st.qs.map((it,i)=>{const a=st.ans[i];const r=a==null?'passée':a===it.q.a?'juste':'fausse';return `<div class="review-item"><p><b>Question ${i+1}</b> <span class="${a===it.q.a?'ok-t':a==null?'muted':'ko-t'}">${r}</span></p>${stemHTML(it.q)}<p class="small" style="margin-top:8px">Bonne réponse : <b>${L5[it.q.a]}</b>, ${it.q.opts[it.q.a]}.${a!=null&&a!==it.q.a?` Ta réponse : ${L5[a]}.`:''}</p><details><summary>Explication</summary><p>${it.q.ex}</p></details></div>`}).join('');
  return h+`<button class="btn primary block" style="margin-top:18px" data-a="next">Continuer</button>`;
}
function finishSprint(timeout){const st=SES.steps[SES.i];if(st.phase!=='run')return;st.phase='review';st.timeout=!!timeout;const now=Date.now();
  const res=st.qs.map((it,i)=>{const a=st.ans[i];const r=a==null?(i>=st.qi&&timeout?'time':'skip'):a===it.q.a?'ok':'ko';if(r==='ko'&&S.cards[it.cid+':p'])S.cards[it.cid+':p'].due=Math.min(S.cards[it.cid+':p'].due,now);return {cid:it.cid,sub:CBYID[it.cid].sub,r,ms:st.ms[i]||undefined}}).filter(r=>r.r!=='time');
  S.sprints.push({t:now,res});const pts=res.reduce((a,r)=>a+(r.r==='ok'?4:r.r==='ko'?-1:0),0);SES.log.push({k:'sprint',pts,n:st.n,ok:res.filter(r=>r.r==='ok').length});save();saveSes();render();window.scrollTo(0,0)}

/* Test du livre */
function vBook(st){
  const pg=bookPage(st.sub,st.test);const title=`${SUBS[st.sub]}, ${st.test<=3?'mini-test':'test blanc'} n° ${st.test}`;
  if(st.phase==='ready')return `<div class="card stack"><h1 style="margin-top:0">${title}</h1><p>Ouvre le livre${pg?` à la page ${pg}`:''}. 15 questions, 20 minutes, comme le jour J. Tu coches tes réponses ici ; les annonces de temps tombent à 10, 5 et 2 minutes de la fin.</p><button class="btn primary block" data-a="bookGo">Lancer les 20 minutes</button></div>`;
  const sheet=(arr,act,extra)=>`<div class="sheet">${arr.map((v,i)=>`<div class="srow"><span class="n">${i+1}</span><div class="bubs">${[0,1,2,3,4].map(j=>`<button class="sb ${v===j?(act==='bookKey'?'key':'on'):''}" data-a="${act}" data-q="${i}" data-j="${j}" aria-label="Question ${i+1}, ${L5[j]}">${L5[j]}</button>`).join('')}</div>${extra?extra(i):''}</div>`).join('')}</div>`;
  if(st.phase==='run')return `<p class="small muted">${title}. Touche une bulle pour la cocher, touche-la à nouveau pour l’effacer.</p>${sheet(st.ans,'bookAns')}<button class="btn block" style="margin-top:18px" data-a="bookEnd">J’ai terminé</button>`;
  if(st.phase==='key')return `<h1>Le corrigé</h1><p class="muted">Pour chaque question, touche la bonne réponse indiquée dans le corrigé du livre. À droite, ce que tu avais coché.</p>${sheet(st.key,'bookKey',i=>`<span class="mine">${st.ans[i]==null?'–':L5[st.ans[i]]}</span>`)}<button class="btn primary block" style="margin-top:18px" data-a="bookCorrect" ${st.key.every(x=>x!=null)?'':'disabled'}>Calculer mon score</button>`;
  if(st.phase==='errs'){const wrong=st.ans.map((a,i)=>i).filter(i=>st.ans[i]!==st.key[i]);const concepts=CONCEPTS.filter(c=>c.sub===st.sub);
    let h=`<div class="card"><div class="bigscore"><span class="poster">${st.score}</span></div><h1 style="margin-top:0;text-align:center">sur 60</h1><p class="muted">${st.nok} justes, ${st.nko} fausses, ${st.nskip} passées.</p></div>`;
    if(!wrong.length)return h+`<p style="margin-top:16px">Aucune erreur. Superbe.</p><button class="btn primary block" data-a="bookSave">Enregistrer</button>`;
    h+=`<h2>Tes erreurs</h2><p class="muted">Pour chacune, indique la notion en jeu et la cause (le corrigé du livre t’aide). Elles reviendront dans tes révisions.</p>`;
    h+=wrong.map(i=>{const e=st.errs[i]||(st.errs[i]={cid:'',cause:''});return `<div class="erow"><p><b>Question ${i+1}</b> <span class="small muted">${st.ans[i]==null?'passée':'tu as coché '+L5[st.ans[i]]}, réponse ${L5[st.key[i]]}</span></p><select data-ch="errC" data-q="${i}"><option value="">Notion en jeu…</option>${concepts.map(c=>`<option value="${c.id}" ${e.cid===c.id?'selected':''}>${c.title}</option>`).join('')}<option value="autre" ${e.cid==='autre'?'selected':''}>Autre notion</option></select><div class="chips" style="margin-top:10px">${['Méthode inconnue','Erreur de calcul','Piège','Manque de temps'].map(k=>`<button class="chip ${e.cause===k?'on':''}" data-a="errCause" data-q="${i}" data-v="${k}">${k}</button>`).join('')}</div></div>`}).join('');
    return h+`<button class="btn primary block" style="margin-top:18px" data-a="bookSave">Enregistrer dans mes révisions</button>`}
  return `<div class="card stack"><p>C’est enregistré. Tes erreurs reviendront dans tes sessions, à partir de demain.</p><button class="btn primary block" data-a="next">Terminer</button></div>`;
}

function vBilan(){
  if(!SES.recorded){SES.recorded=true;recordSession()}
  const L=SES.log;const qs=L.filter(x=>x.k==='prob'||x.k==='card'||x.k==='recog');const ok=qs.filter(x=>x.ok).length;
  const warm=L.find(x=>x.k==='warm'),sp=L.find(x=>x.k==='sprint'),cps=L.filter(x=>x.k==='concept');
  const mins=Math.round((Date.now()-SES.start)/60000);const tomorrow=Object.values(S.cards).filter(c=>c.due<Date.now()+DAY).length;
  let h=`<div class="card hero"><div class="bigscore"><span class="poster">${qs.length?ok+'/'+qs.length:'Fini'}</span></div><h1 style="margin-top:0;text-align:center">Session terminée</h1><p class="muted" style="text-align:center">${mins} minute${mins>1?'s':''}.</p><ol class="plan">`;
  if(warm)h+=`<li><span>Réflexes : ${warm.ok} sur ${warm.n}</span></li>`;
  if(qs.length)h+=`<li><span>Révisions et exercices : ${ok} réussis sur ${qs.length}</span></li>`;
  cps.forEach(cp=>{h+=`<li><span>Nouveau concept : ${CBYID[cp.cid].title} (${cp.score}/4 au quiz)</span></li>`});
  if(sp)h+=`<li><span>Sprint : ${sp.pts>0?'+':''}${sp.pts} points, ${sp.ok} juste${sp.ok>1?'s':''} sur ${sp.n}</span></li>`;
  h+=`</ol><p>Pour la suite, laisse passer au moins une heure : c’est cette pause qui fixe ce que tu viens de travailler. D’ici 24 heures, ${tomorrow} carte${tomorrow>1?'s':''} ${tomorrow>1?'seront':'sera'} à revoir.</p><button class="btn primary block" data-a="endSes">Terminer</button></div>`;
  return h;
}
function recordSession(){const d=Math.round((Date.now()-SES.start)/1000);if(SES.log.length)S.sessions.push({t:SES.start,d,kind:SES.kind,sprint:!!SES.sprinted});if(S.sessions.length>500)S.sessions=S.sessions.slice(-400);save()}

/* ============ Rendu ============ */
function render(){
  document.body.classList.toggle('ses',!!SES);
  const key=SES?'s'+SES.i+'-'+(SES.steps[SES.i]||{}).k:'t'+TAB+(PAGE.cid||'');
  $('#app').innerHTML=SES?viewSession():{today:viewToday,cours:viewCours,train:viewTrain,prog:viewProg}[TAB]();
  $('#tabs').innerHTML=tabsHTML();
  const o=$('#ovl');if(OVL){o.hidden=false;o.innerHTML=`<div class="inner"><div class="topbar"><button class="icon" data-a="closeOvl" aria-label="Fermer">✕</button><div class="tb-mid"><div class="tb-label">Fiche de cours</div></div></div><h1>${CBYID[OVL.cid].title}</h1>${ficheHTML(CBYID[OVL.cid],OVL.fs)}<button class="btn primary block" style="margin-top:24px" data-a="closeOvl">Revenir à la question</button></div>`}else{o.hidden=true;o.innerHTML=''}
  if(key!==LASTKEY){window.scrollTo(0,0);if(!OVL)UI.scr=UI.scr&&false;LASTKEY=key}

}
function nextStep(){SES.i++;UI.scr=false;if(SES.i>=SES.steps.length){SES=null;PENDING=null;applyPending()}saveSes();render()}
function endSession(){if(SES&&!SES.recorded){SES.recorded=true;recordSession()}SES=null;PENDING=null;applyPending();saveSes();render()}
function startSes(s){SES=s;PENDING=null;OVL=null;saveSes();render()}

function syncHTML(){

  if(SYNC.state==='nokey')return `<div class="syncline off"><i></i>Pas encore d’espace personnel</div><p class="small">Crée ton espace : l’app génère ton lien personnel. Ouvre ensuite ce lien sur tes autres appareils pour y retrouver ta progression.</p><button class="btn primary block" data-a="createSpace">Créer mon espace</button>`;
  let h=`<div class="syncline ${SYNC.state==='sync'?'':'off'}"><i></i>${SYNC.state==='sync'?'Synchronisé':SYNC.state==='connecting'?'Connexion en cours…':'Hors ligne pour l’instant, nouvel essai automatique'}</div>`;
